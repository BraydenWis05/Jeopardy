<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UX Trends Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Anton&family=Barlow:wght@400;500;600;700&family=Spectral:wght@500;700&display=swap">
<style>
/* Layout: game-show stage. Setup screen -> rules slides -> board with podiums -> full-screen clue.
   Missed clues open a lesson. Presentation mode walks through every lesson slide by slide. */
:root {
  color-scheme: dark;
  --night: #04050f;
  --board-used: #09134f;
  --gold: #eba43f;
  --ink: #ffffff;
  --ink-soft: #b8c2f5;
  --line: #000000;
  --right: #3ddc97;
  --wrong: #ff7a7a;
  --tile-top: #1528c6;
  --tile-bottom: #0a17a4;
  --bezel: #03051a;
  --rim: #19226b;
  --lamp: #ffc861;
  --podium: #070b2c;
  --font-board: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-clue: "Spectral", Georgia, "Times New Roman", serif;
  --font-ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 500 15px/1.45 var(--font-ui);
  background: radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%) fixed var(--night);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Buttons look like the show's on-screen labels: square, condensed, uppercase. */
.btn {
  border: 2px solid #000; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border-radius: 2px;
  padding: 8px 16px; font: 700 15px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .06em;
  box-shadow: 2px 2px 0 #000;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
.btn.primary { background: var(--gold); color: #000; }
.btn.big { padding: 12px 22px; font-size: 19px; }
.btn.right { background: #0d6b45; }
.btn.wrong { background: #8a1f2b; }
.title {
  margin: 0; font: 400 clamp(36px, 6vw, 72px)/1 var(--font-board);
  text-transform: uppercase; letter-spacing: .03em; color: var(--gold); text-shadow: 4px 4px 0 #000;
}

/* Setup */
.setup { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 32px; }
.setup-card { width: 100%; max-width: 1000px; display: grid; gap: 22px; text-align: center; }
.setup-card > p { margin: 0; font: 600 clamp(16px, 1.8vw, 20px)/1.4 var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.team-setup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; text-align: left; }
.team-setup fieldset {
  margin: 0; border: 3px solid #000; padding: 14px; display: grid; gap: 8px;
  background: linear-gradient(var(--tile-top), var(--tile-bottom));
}
.team-setup legend { padding: 0; float: left; width: 100%; font: 400 22px/1 var(--font-board); text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 #000; margin-bottom: 4px; }
.team-setup input, .field input {
  width: 100%; background: rgba(0, 0, 20, .55); border: 1px solid rgba(0, 0, 0, .8); border-radius: 0; padding: 8px 10px; font-size: 16px;
}
.team-setup input.team-name { font: 400 18px/1.2 var(--font-board); text-transform: uppercase; letter-spacing: .03em; }
.team-setup .sub { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); margin-top: 4px; }
.setup-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 760px) { .team-setup { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field label { font: 600 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

/* Game: the TV set. Bronze top band with a row of lights, orange ladder pillars edged in blue,
   a charcoal frame around a flat blue board split by black lines, a blue neon floor. */
.app {
  height: 100%; min-height: 680px; display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
  background:
    radial-gradient(circle at 96% 62%, rgba(150, 60, 210, .35), transparent 28%),
    radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%);
}
.stage {
  flex: 1; min-height: 0; width: 100%; max-width: 1500px; margin: 0 auto;
  display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px; grid-template-rows: 44px 1fr 22px; column-gap: 18px;
}
.lamps {
  grid-column: 1 / -1; position: relative; border-radius: 10px 10px 0 0;
  background: linear-gradient(#2c1e12, #70502e 45%, #3a2817 80%, #1a120b);
  box-shadow: 0 2px 0 #000;
}
.lamps::before {
  content: ""; position: absolute; left: 2%; right: 2%; top: 7px; height: 3px; border-radius: 2px;
  background: var(--lamp); box-shadow: 0 0 6px var(--lamp), 0 8px 0 #c98d3f, 0 8px 6px rgba(255, 190, 90, .6);
}
.lamps::after {
  content: ""; position: absolute; left: 3%; right: 3%; bottom: 5px; height: 9px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #cfe8ff 0 52px, #1d2846 52px 58px);
  box-shadow: 0 0 10px rgba(160, 210, 255, .8);
}
.pillar {
  grid-row: 2; display: grid; grid-template-rows: repeat(10, 1fr); padding: 10px 12px; margin-block: 8px;
  background: #0a0e2c; border: 4px solid #5aa8ff; border-radius: 3px;
  box-shadow: 0 0 12px rgba(90, 168, 255, .9), 0 0 30px rgba(60, 120, 255, .45), inset 0 0 10px rgba(90, 168, 255, .55);
}
.pillar i {
  margin-inline: -22px;
  background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat;
}
.pillar i:last-child { background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(#a3a5ad, #6a6d75) bottom / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat; }
.bezel {
  grid-row: 2; grid-column: 2; display: flex; padding: 14px; border-radius: 12px; overflow-x: auto;
  background: linear-gradient(#24252c, #141519); box-shadow: inset 0 0 0 2px #31333c, 0 0 0 2px #050507;
}
.board {
  flex: 1; min-width: 720px; display: grid; grid-template-columns: repeat(6, 1fr);
  grid-template-rows: 1fr repeat(5, 1fr); gap: 6px; padding: 6px; background: #000;
}
.floor {
  grid-column: 1 / -1; grid-row: 3; align-self: end; height: 12px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #3a74ff 0 140px, #0d1a55 140px 144px);
  box-shadow: 0 0 22px 4px rgba(40, 100, 255, .6);
}
.cat, .tile {
  border: 0; border-radius: 0; min-height: 48px;
  background: linear-gradient(var(--tile-top), var(--tile-bottom));
  box-shadow: inset 0 0 18px rgba(0, 0, 50, .45);
  display: grid; place-items: center; text-align: center; padding: 6px 8px;
}
.cat {
  color: #fff; font: 400 clamp(16px, 1.9vw, 28px)/1.05 var(--font-board); letter-spacing: .02em;
  text-transform: uppercase; text-wrap: balance; text-shadow: 2px 2px 0 #000;
}
.tile {
  color: var(--gold); font: 400 clamp(28px, 3.7vw, 58px)/1 var(--font-board); letter-spacing: .05em;
  text-shadow: 3px 3px 0 #000, 4px 4px 3px rgba(0,0,0,.5); font-variant-numeric: tabular-nums;
  transition: filter .15s;
}
.tile:hover { filter: brightness(1.2); }
.tile.used { color: transparent; text-shadow: none; }
.tile.used:hover { filter: brightness(1.08); }
.tile.selected {
  position: relative; z-index: 1; color: #fff; text-shadow: 2px 2px 0 #000;
  font: 400 clamp(11px, 1.15vw, 17px)/1.25 var(--font-board); letter-spacing: .02em; text-transform: uppercase; filter: none;
  box-shadow: 0 0 0 2px #e6eeff, 0 0 26px 6px rgba(140, 180, 255, .85);
}

/* Podiums: who is up for each team right now. */
.podiums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 1100px; margin: 0 auto; }
.podium {
  position: relative; text-align: center; padding: 8px 10px 10px; border: 3px solid #000;
  background: linear-gradient(#5b4127, #2a1d10); min-width: 0;
}
.podium .p-player {
  display: block; padding: 6px 4px; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000;
  font: 400 clamp(18px, 2.1vw, 30px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .03em;
  text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere;
}
.podium .p-team { display: block; margin-top: 6px; font: 700 clamp(12px, 1.2vw, 15px)/1 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: #f1d7a8; }
.podium.up { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(235, 164, 63, .55); }
.podium.up::before {
  content: "Picks"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  background: var(--gold); color: #000; padding: 2px 8px; font: 700 12px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .1em;
}

.bar { display: flex; justify-content: center; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.turn-line { margin: 0; font: 400 clamp(18px, 2vw, 26px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .04em; }
.turn-line b { color: var(--gold); font-weight: 400; }
.scoreboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 960px; }
.score-card { background: linear-gradient(#5b4127, #2a1d10); border: 3px solid #000; padding: 18px 14px; display: grid; gap: 10px; min-width: 0; }
.score-card.up { box-shadow: 0 0 0 3px var(--gold); }
.score-card .name { font: 400 clamp(20px, 2.4vw, 30px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.score-card .score { font: 400 clamp(40px, 6vw, 76px)/1 var(--font-board); color: #fff; text-shadow: 3px 3px 0 #000; font-variant-numeric: tabular-nums; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000; padding: 8px 4px; }
.score-card .score.neg { color: var(--wrong); }
.score-card .players { font: 600 14px/1.4 var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: #f1d7a8; }
.score-card .adj { display: flex; justify-content: center; gap: 8px; }
.score-card .adj button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #f1d7a8; font-size: 13px; padding: 3px 10px; }
.score-card .adj button:hover { background: rgba(0,0,0,.3); color: var(--ink); }
@media (max-width: 700px) { .scoreboard { grid-template-columns: 1fr; } }

.menu { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 10px; }
.menu-btn {
  opacity: .25; border: 1px solid var(--rim); background: var(--bezel); border-radius: 2px; padding: 5px 9px;
  display: grid; gap: 3px; transition: opacity .15s;
}
.menu-btn span { display: block; width: 16px; height: 2px; background: var(--ink-soft); }
.menu-btn:hover, .menu-btn:focus-visible, .menu.open .menu-btn { opacity: 1; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 230px; display: grid; padding: 4px;
  background: var(--podium); border: 2px solid #000; box-shadow: 4px 4px 0 #000;
}
.menu-list button {
  text-align: left; background: transparent; border: 0; padding: 9px 12px;
  font: 700 16px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .05em;
}
.menu-list button:hover { background: var(--tile-bottom); }
.menu-list hr { border: 0; border-top: 1px solid var(--rim); margin: 4px 0; width: 100%; }
.count {
  display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 6px;
  background: var(--wrong); color: #000; font-size: 13px; font-weight: 700;
  text-align: center; font-variant-numeric: tabular-nums;
}
.count[data-n="0"] { background: var(--rim); color: var(--ink-soft); }

@media (max-width: 700px) {
  .app { height: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: 30px auto 24px; }
  .pillar { display: none; }
  .bezel { grid-column: 1; }
  .podiums { gap: 8px; }
}

/* Overlay */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); display: flex; flex-direction: column; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  animation: open .2s ease-out;
}
@keyframes open { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .overlay { animation: none; } .tile, .menu-btn { transition: none; } }
.ov-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font: 400 clamp(18px, 2vw, 26px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .04em; text-shadow: 2px 2px 0 #000;
}
.ov-head .val { color: var(--gold); font-variant-numeric: tabular-nums; }
.ov-body {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding-block: 20px; max-width: 1100px; width: 100%; margin: 0 auto; text-align: center;
}
.who { margin: 0; font: 400 clamp(18px, 2vw, 26px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .05em; color: var(--gold); text-shadow: 2px 2px 0 #000; }
.who small { display: block; margin-top: 4px; font: 700 14px/1 var(--font-display); letter-spacing: .1em; color: var(--ink-soft); text-shadow: none; }
.clue { margin: 0; font: 700 clamp(24px, 3.6vw, 46px)/1.25 var(--font-clue); text-transform: uppercase; text-shadow: 2px 3px 0 #000; text-wrap: balance; }
.clue.small { font-size: clamp(17px, 2vw, 26px); text-shadow: none; color: var(--ink-soft); }
.answer { font: 700 clamp(22px, 2.8vw, 34px)/1.3 var(--font-clue); color: var(--gold); text-wrap: balance; margin: 0; text-shadow: 2px 2px 0 #000; }
.big-word { font: 400 clamp(48px, 9vw, 110px)/.95 var(--font-board); text-transform: uppercase; color: var(--gold); text-shadow: 5px 5px 0 #000; }
.hint { color: var(--ink-soft); font-size: 15px; margin: 0; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.status { font: 700 clamp(18px, 1.8vw, 22px)/1.3 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.status.known { color: var(--right); }
.status.taught { color: var(--wrong); }
.inline { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 720px; }
.inline .field { flex: 1 1 180px; text-align: left; }

/* Lesson (shown after a miss, in the teaching list, and as a slide) */
.lesson {
  background: rgba(0, 0, 25, .5); border: 3px solid #000; padding: 22px 26px;
  text-align: left; width: 100%; max-width: 820px; display: grid; gap: 12px;
}
.lesson .tag { font: 700 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.lesson h2 { margin: 0; font: 400 clamp(26px, 3vw, 38px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .02em; color: var(--gold); text-shadow: 2px 2px 0 #000; text-wrap: balance; }
.lesson p { margin: 0; font: 500 18px/1.55 var(--font-clue); max-width: 68ch; }
.lesson .label { display: block; margin-bottom: 2px; font: 700 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--gold); }
.lesson .src { font: 500 14px/1.45 var(--font-ui); color: var(--ink-soft); }

.timer { width: 100%; max-width: 640px; display: grid; gap: 6px; }
.timer .track { height: 12px; background: #000; border: 2px solid #000; overflow: hidden; }
.timer .fill { height: 100%; background: var(--gold); transform-origin: left; animation: drain 30s linear forwards; }
.timer .left { font: 400 26px/1 var(--font-board); color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 #000; }
.timer.done .left { color: var(--wrong); }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.out { color: var(--wrong); }
.list { display: grid; gap: 14px; width: 100%; max-width: 860px; }
.list .lesson { max-width: none; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stat { background: rgba(0, 0, 25, .5); border: 3px solid #000; padding: 10px 16px; min-width: 120px; }
.stat b { display: block; font: 400 34px/1 var(--font-board); font-variant-numeric: tabular-nums; }
.stat.k b { color: var(--right); } .stat.t b { color: var(--wrong); }
.stat span { font: 700 13px/1.2 var(--font-display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; }

/* Slides (rules and presentation mode). Sized for a projector. */
.deck-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.deck-foot .pos { font: 400 20px/1 var(--font-board); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.slide { width: 100%; max-width: 1100px; display: grid; gap: 22px; text-align: left; }
.slide.center { text-align: center; justify-items: center; }
.slide .kicker { margin: 0; font: 700 clamp(15px, 1.6vw, 20px)/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .14em; color: var(--ink-soft); }
.slide h2 { margin: 0; font: 400 clamp(38px, 5.5vw, 76px)/1.02 var(--font-board); text-transform: uppercase; letter-spacing: .02em; color: var(--gold); text-shadow: 4px 4px 0 #000; text-wrap: balance; }
.slide .body { margin: 0; font: 500 clamp(20px, 2.3vw, 30px)/1.5 var(--font-clue); max-width: 62ch; text-shadow: 1px 2px 0 rgba(0,0,0,.6); }
.slide .ask { margin: 0; padding: 16px 20px; background: rgba(0, 0, 25, .5); border: 3px solid #000; font: 700 clamp(18px, 2vw, 26px)/1.4 var(--font-clue); max-width: 62ch; }
.slide .ask .label { display: block; font: 700 14px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin-bottom: 4px; }
.slide .src { margin: 0; font: 500 clamp(13px, 1.2vw, 16px)/1.45 var(--font-ui); color: var(--ink-soft); }
.slide ol, .slide ul { margin: 0; padding-left: 1.2em; display: grid; gap: 14px; font: 500 clamp(20px, 2.3vw, 30px)/1.4 var(--font-clue); max-width: 62ch; }
.slide li::marker { color: var(--gold); font-family: var(--font-board); }
.slide .roster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; text-align: center; }
.slide .roster div { background: linear-gradient(#5b4127, #2a1d10); border: 3px solid #000; padding: 14px; }
.slide .roster b { display: block; font: 400 clamp(22px, 2.6vw, 34px)/1.1 var(--font-board); text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 #000; margin-bottom: 8px; }
.slide .roster span { display: block; font: 600 clamp(16px, 1.7vw, 22px)/1.4 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.slide .sources { columns: 2 380px; column-gap: 32px; font: 500 15px/1.45 var(--font-ui); }
.slide .sources h3 { margin: 0 0 4px; font: 400 20px/1.1 var(--font-board); text-transform: uppercase; color: var(--gold); break-after: avoid; }
.slide .sources ul { font: inherit; gap: 4px; margin-bottom: 16px; break-inside: avoid; }
@media (max-width: 700px) { .slide .roster { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="setup" id="setup" hidden>
  <form class="setup-card" id="setupForm">
    <h1 class="title">UX Trends Jeopardy</h1>
    <p>Three teams of four. List players in the order they come up to the podium.</p>
    <div class="team-setup" id="teamSetup"></div>
    <div class="setup-actions">
      <button class="btn primary big" type="submit">Start game</button>
      <button class="btn big" type="button" id="resume" hidden>Resume saved game</button>
    </div>
  </form>
</main>

<div class="app" id="game" hidden>
  <div class="menu" id="menu">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Game menu" aria-expanded="false" aria-controls="menuList"><span></span><span></span><span></span></button>
    <div class="menu-list" id="menuList" hidden>
      <button id="btnPresent" type="button">Presentation mode</button>
      <button id="btnList" type="button">Topics to teach<span class="count" id="missCount">0</span></button>
      <button id="btnRules" type="button">Rules</button>
      <button id="btnFinal" type="button">Final Jeopardy</button>
      <hr>
      <button id="btnMusic" type="button">Play thinking music</button>
      <button id="btnSound" type="button" aria-pressed="true">Sound on</button>
      <button id="btnFull" type="button">Full screen</button>
      <button id="btnReset" type="button">New game</button>
    </div>
  </div>
  <h1 class="sr-only">UX Trends Jeopardy</h1>
  <div class="stage">

/* ===================== GAME LOGIC ===================== */
const STORE_KEY = "ux-jeopardy-v3";
const TEAM_COUNT = 3, TEAM_SIZE = 4;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString();

/* ---------- Sound ----------
   Thinking music: if a file called thinking-music.mp3 sits next to this page, it plays that.
   Otherwise it plays an original tune built with Web Audio. */
const MUSIC_FILE = "thinking-music.mp3";
const Sound = (() => {
  let ctx = null, music = null, timer = null, tick = null;
  let on = true;
  try { on = localStorage.getItem("ux-jeopardy-sound") !== "off"; } catch (e) {}
  const track = new Audio();
  let trackOk = false;
  track.preload = "auto";
  track.addEventListener("canplaythrough", () => { trackOk = true; }, { once: true });
  track.addEventListener("error", () => { trackOk = false; });
  if (location.protocol !== "about:") track.src = MUSIC_FILE;

  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function audio() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function note(out, midi, start, dur, type = "triangle", vol = .18) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = hz(midi);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + .008);
    g.gain.exponentialRampToValueAtTime(.001, start + dur);
    o.connect(g).connect(out); o.start(start); o.stop(start + dur + .05);
  }
  // A plucky "piano": a triangle with a quiet sine an octave up.
  function keys(out, midi, start, dur, vol) {
    note(out, midi, start, dur, "triangle", vol);
    note(out, midi + 12, start, dur * .6, "sine", vol * .3);
  }
  function play(seq, type, vol) {           // seq: [[midi, startOffset, duration], ...]
    if (!on || !audio()) return;
    const t = ctx.currentTime + .02;
    seq.forEach(([m, s, d]) => note(ctx.destination, m, t + s, d, type, vol));
  }
  // An original 8-bar tune in F (F, Bb, F, C, F, Bb, C, F), eighth notes at 120 bpm.
  const MELODY = [
    65,0,69,72, 77,0,72,0,   70,0,74,77, 74,0,70,0,
    72,0,69,65, 69,72,0,0,   67,0,70,72, 76,0,0,0,
    65,0,69,72, 77,0,72,0,   70,0,74,77, 82,0,79,0,
    79,77,76,74, 72,0,70,67, 65,0,72,0, 65,0,0,0
  ];
  const BASS = [41,48,45,48, 46,53,50,53, 41,48,45,48, 36,43,40,43, 41,48,45,48, 46,53,50,53, 36,43,40,43, 41,48,45,36];
  function stopMusic() {
    clearTimeout(timer); clearInterval(tick); timer = tick = null;
    if (!track.paused) track.pause();
    if (music) { const g = music; g.gain.setTargetAtTime(0, ctx.currentTime, .05); setTimeout(() => g.disconnect(), 300); music = null; }
  }
  function startMusic(seconds, onTick, onEnd) {
    stopMusic();
    const end = Date.now() + seconds * 1000;
    onTick && onTick(seconds);
    tick = setInterval(() => onTick && onTick(Math.max(0, Math.ceil((end - Date.now()) / 1000))), 250);
    timer = setTimeout(() => { stopMusic(); onTick && onTick(0); timesUp(); onEnd && onEnd(); }, seconds * 1000);
    if (!on) return;
    if (trackOk) { track.currentTime = 0; track.volume = .85; track.play().catch(() => {}); return; }
    if (!audio()) return;
    music = ctx.createGain(); music.gain.value = 1; music.connect(ctx.destination);
    const t0 = ctx.currentTime + .05, e = .25;
    for (let i = 0; i < seconds / e; i++) {
      const t = t0 + i * e, m = MELODY[i % MELODY.length];
      if (m) keys(music, m, t, e * 1.7, .12);
      if (i % 2 === 0) note(music, BASS[(i / 2) % BASS.length], t, e * 1.8, "sine", .24);
      if (i % 4 === 2) note(music, 91, t, .04, "square", .02);   // light offbeat tick
    }
  }
  const right = () => play([[76, 0, .15], [84, .12, .35]], "triangle", .2);
  const wrong = () => play([[43, 0, .45], [42, 0, .45]], "sawtooth", .08);
  const timesUp = () => play([[48, 0, .7], [47, 0, .7]], "square", .07);
  const dailyDouble = () => play([60, 64, 67, 72, 76, 79, 84].map((m, i) => [m, i * .07, .5]), "triangle", .14);
  const prime = () => { if (on) audio(); };
  function toggle() {
    on = !on;
    try { localStorage.setItem("ux-jeopardy-sound", on ? "on" : "off"); } catch (e) {}
    if (!on) stopMusic();
    return on;
  }
  return { startMusic, stopMusic, right, wrong, dailyDouble, toggle, prime, get on() { return on; }, get playing() { return !!timer; } };
})();

function runTimer(seconds) {
  const box = $("#timer"); if (!box) return;
  box.hidden = false; box.classList.remove("done");
  Sound.startMusic(seconds,
    n => { const l = box.querySelector(".left"); if (l) l.textContent = n ? n + "s" : "Time's up"; },
    () => box.classList.add("done"));
}
const timerHtml = `<div class="timer" id="timer" hidden><div class="track"><div class="fill"></div></div><div class="left">30s</div></div>`;

let state = null;   // { teams: [{ name, score, players }], turn, rot, used, dd, finalDone }
let view = null;    // what the overlay is showing

function newState(teams) {
  const cells = [];
  GAME.categories.forEach((c, ci) => c.clues.forEach((_, ri) => { if (ri >= 2) cells.push(ci + "-" + ri); }));
  return {
    teams: teams.map(t => ({ name: t.name, players: t.players, score: 0 })),
    turn: 0,                  // team that picks next
    rot: 0,                   // which player on every team is at the podium
    used: {},                 // "col-row" -> "known" | "taught"
    dd: cells[Math.floor(Math.random() * cells.length)],
    finalDone: null           // null | "known" | "taught"
  };
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function loadSaved() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.teams && s.teams.length === TEAM_COUNT && s.teams.every(t => t.players && t.players.length === TEAM_SIZE)) return s;
  } catch (e) {}
  return null;
}
const teamUp = () => state.teams[state.turn];
const playerUp = i => state.teams[i].players[state.rot % TEAM_SIZE];
const nextTurn = () => { state.turn = (state.turn + 1) % TEAM_COUNT; state.rot = (state.rot + 1) % TEAM_SIZE; };
const clueById = id => { const [c, r] = id.split("-").map(Number); return { cat: GAME.categories[c], clue: GAME.categories[c].clues[r] }; };

/* ---------- Screens ---------- */
function buildSetup() {
  let h = "";
  for (let i = 0; i < TEAM_COUNT; i++) {
    h += `<fieldset><legend>Team ${i + 1}</legend>
      <input class="team-name" id="name-${i}" maxlength="24" placeholder="Team ${i + 1}" autocomplete="off" aria-label="Team ${i + 1} name">
      <span class="sub">Players, in order</span>`;
    for (let j = 0; j < TEAM_SIZE; j++) h += `<input id="p-${i}-${j}" maxlength="20" placeholder="Player ${j + 1}" autocomplete="off" aria-label="Team ${i + 1}, player ${j + 1}">`;
    h += `</fieldset>`;
  }
  $("#teamSetup").innerHTML = h;
}
function showSetup() {
  view = null; drawOverlay();
  $("#game").hidden = true; $("#setup").hidden = false;
  const saved = loadSaved();
  $("#resume").hidden = !saved;
  for (let i = 0; i < TEAM_COUNT; i++) {
    $("#name-" + i).value = saved ? saved.teams[i].name : "";
    for (let j = 0; j < TEAM_SIZE; j++) $(`#p-${i}-${j}`).value = saved ? saved.teams[i].players[j] : "";
  }
  $("#name-0").focus();
}
function showGame() {
  $("#setup").hidden = true; $("#game").hidden = false;
  $("#btnSound").textContent = Sound.on ? "Sound on" : "Sound off"; $("#btnSound").setAttribute("aria-pressed", Sound.on);
  render();
}

function render() {
  const b = $("#board");
  let h = GAME.categories.map(c => `<div class="cat">${esc(c.name)}</div>`).join("");
  for (let r = 0; r < 5; r++) GAME.categories.forEach((c, ci) => {
    const id = ci + "-" + r, clue = c.clues[r], used = state.used[id];
    const label = used ? `${c.name}, $${clue.value}, played. Open to review the lesson.` : `${c.name} for $${clue.value}`;
    h += `<button type="button" class="tile${used ? " used" : ""}" data-id="${id}" aria-label="${esc(label)}">$${clue.value.toLocaleString()}</button>`;
  });
  b.innerHTML = h;

  const left = GAME.categories.length * 5 - Object.keys(state.used).length;
  $("#turnLine").innerHTML = left ? `<b>${esc(teamUp().name)}</b> picks the next clue` : `Board cleared. Time for <b>Final Jeopardy</b>`;
  $("#podiums").innerHTML = state.teams.map((t, i) => `
    <div class="podium${left && i === state.turn ? " up" : ""}">
      <span class="p-player">${esc(playerUp(i))}</span><span class="p-team">${esc(t.name)}</span>
    </div>`).join("");
  if (view && view.kind === "scores") drawScores();

  const missed = Object.values(state.used).filter(v => v === "taught").length + (state.finalDone === "taught" ? 1 : 0);
  $("#missCount").textContent = missed; $("#missCount").dataset.n = missed;
  save();
}

/* ---------- Clue overlay ---------- */
const topic = item => item.answer.replace(/^(What|Who) (is|are) /, "").replace(/\?$/, "");
function lessonCard(item, tag) {
  return `<article class="lesson">
    <span class="tag">${esc(tag)}</span>
    <h2>${esc(topic(item))}</h2>
    <p>${esc(item.note)}</p>
    <p><span class="label">Ask the class</span>${esc(item.ask)}</p>
    <p class="src">Source: ${esc(item.source)}</p>
  </article>`;
}

function openClue(id) {
  if (state.used[id]) { view = { id, step: "review" }; return drawOverlay(); }
  if (id === state.dd) {
    view = { id, step: "dd", team: state.turn, out: [], wager: null };
    drawOverlay(); return Sound.dailyDouble();
  }
  // The team that's up answers first. If they miss, another team can steal.
  view = { id, step: "clue", team: state.turn, out: [], wager: null };
  drawOverlay(); runTimer(30);
}
const allTeams = () => state.teams.map((_, i) => i);
const remaining = () => allTeams().filter(i => !view.out.includes(i));
let selecting = false;
function selectTile(el) {
  const id = el.dataset.id;
  if (selecting) return;
  if (state.used[id]) return openClue(id);
  selecting = true;
  el.classList.add("selected");
  el.textContent = id === state.dd ? "Daily Double" : clueById(id).clue.clue;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => { selecting = false; openClue(id); }, reduce ? 150 : 900);
  Sound.prime();
}
function toggleMenu(force) {
  const list = $("#menuList"), open = force ?? list.hidden;
  list.hidden = !open; $("#menu").classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", open);
  $("#btnMusic").textContent = Sound.playing ? "Stop music" : "Play thinking music";
}
document.addEventListener("fullscreenchange", () => { $("#btnFull").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
document.addEventListener("pointerdown", e => { if (!e.target.closest("#menu") && !$("#menuList").hidden) toggleMenu(false); });

function finishClue(result) { state.used[view.id] = result; nextTurn(); render(); }

function drawOverlay() {
  Sound.stopMusic();
  const ov = $("#overlay");
  if (!view) { ov.hidden = true; ov.innerHTML = ""; return; }
  if (view.kind === "list") return drawList();
  if (view.kind === "scores") return drawScores();
  if (view.kind === "final") return drawFinal();
  if (view.kind === "deck") return drawDeck();

  const { cat, clue } = clueById(view.id);
  const team = state.teams[view.team];
  const amount = view.wager ?? clue.value;
  const nameOf = i => esc(state.teams[i].name);
  const whoOf = i => `${esc(playerUp(i))}<small>for ${nameOf(i)}</small>`;
  const missed = view.out && view.out.length ? `<p class="hint out">Missed: ${view.out.map(i => esc(playerUp(i))).join(", ")}</p>` : "";
  let body = "";

  switch (view.step) {
    case "dd": {
      const max = Math.max(team.score, 500);
      body = `<div class="big-word">Daily Double</div>
        <p class="status">${esc(playerUp(view.team))} plays this one alone for ${esc(team.name)}.</p>
        <div class="inline"><div class="field"><label for="ddWager">Wager, $5 to $${max.toLocaleString()}</label>
          <input id="ddWager" type="number" inputmode="numeric" min="5" max="${max}" step="100" placeholder="${clue.value}"></div></div>
        <div class="actions"><button class="btn primary big" id="ddGo" type="button">Show the clue</button></div>`;
      break;
    }
    case "clue": {
      let who, buttons = "";
      if (view.team != null) {
        who = `<p class="who">${whoOf(view.team)}</p>`;
        buttons = `<button class="btn right big" data-judge="right" type="button">Correct, +$${amount.toLocaleString()}</button>
          <button class="btn wrong big" data-judge="wrong" type="button">Wrong${view.wager != null ? ", -$" + amount.toLocaleString() : ""}</button>`;
      } else {
        who = `<p class="who">Who wants to steal it?</p>`;
        buttons = remaining().map(i => `<button class="btn big" data-pick="${i}" type="button">${esc(playerUp(i))} (${nameOf(i)})</button>`).join("");
      }
      body = `${who}
        <p class="clue">${esc(clue.clue)}</p>
        ${missed}
        ${view.out.length ? "" : timerHtml}
        <div class="actions">${buttons}<button class="btn big" id="reveal" type="button">Show answer</button></div>`;
      break;
    }
    case "answer": {
      const can = view.wager != null ? [view.team] : remaining();
      body = `<p class="clue small">${esc(clue.clue)}</p>
        <p class="answer">${esc(clue.answer)}</p>
        ${missed}
        <p class="who">Who got it?</p>
        <div class="actions">
          ${can.map(i => `<button class="btn right big" data-award="${i}" type="button">${esc(playerUp(i))} (${nameOf(i)})</button>`).join("")}
          <button class="btn wrong big" id="nobody" type="button">Nobody got it</button>
        </div>`;
      break;
    }
    case "known":
      body = `<p class="status known">${esc(view.winnerName)} got it for ${nameOf(view.winner)}. No lesson needed.</p>
        <p class="answer">${esc(clue.answer)}</p>
        <div class="actions"><button class="btn primary big" data-close type="button">Back to board</button>
          <button class="btn big" id="teachAnyway" type="button">Show the lesson anyway</button></div>`;
      break;
    case "teach":
    case "review":
      body = `${view.step === "teach" ? `<p class="status taught">Nobody got it. Teach this one.</p>` : ""}
        ${lessonCard(clue, cat.name + ", $" + clue.value)}
        <div class="actions"><button class="btn primary big" data-close type="button">Back to board</button></div>`;
      break;
  }

  const val = view.wager != null ? "Daily Double, " + money(amount) : money(clue.value);
  ov.innerHTML = `<div class="ov-head"><span>${esc(cat.name)}</span><span class="val">${val}</span>
    <button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body">${body}</div>`;
  ov.hidden = false;
  (ov.querySelector(".ov-body input, .ov-body .btn.primary, .ov-body .btn") || ov).focus({ preventScroll: true });
}

/* ---------- Scores ---------- */
function drawScores() {
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>Scores</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body"><div class="scoreboard">${state.teams.map((t, i) => `

      </div>`).join("")}</div>
      <p class="hint">Use -100 and +100 to fix a score.</p></div>`;

/* ---------- Teaching list ---------- */
function drawList() {
  Sound.stopMusic();
  const items = [];
  GAME.categories.forEach((c, ci) => c.clues.forEach((cl, ri) => {
    if (state.used[ci + "-" + ri] === "taught") items.push(lessonCard(cl, c.name + ", $" + cl.value));
  }));
  if (state.finalDone === "taught") items.push(lessonCard(GAME.final, "Final Jeopardy, " + GAME.final.category));
  const total = GAME.categories.length * 5, vals = Object.values(state.used);
  const known = vals.filter(v => v === "known").length, taught = vals.filter(v => v === "taught").length;
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>Topics to teach</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body" style="justify-content:flex-start">
      <div class="stats">
        <div class="stat k"><b>${known}</b><span>Class knew</span></div>
        <div class="stat t"><b>${taught}</b><span>Need teaching</span></div>
        <div class="stat"><b>${total - vals.length}</b><span>Not played</span></div>
      </div>
      <div class="list">${items.length ? items.join("") : `<p class="hint">Nothing yet. Any clue nobody answers shows up here with its lesson.</p>`}</div>
    </div>`;
  ov.hidden = false;
  ov.querySelector("[data-close]").focus({ preventScroll: true });
}

/* ---------- Slides: rules and presentation mode ---------- */
function rulesSlides() {
  const slides = [];
  if (state) slides.push(`<div class="slide center"><p class="kicker">Tonight's teams</p><h2>UX Trends Jeopardy</h2>
    <div class="roster">${state.teams.map(t => `<div><b>${esc(t.name)}</b>${t.players.map(p => `<span>${esc(p)}</span>`).join("")}</div>`).join("")}</div></div>`);
  GAME.rules.forEach((r, i) => slides.push(`<div class="slide"><p class="kicker">Rules, ${i + 1} of ${GAME.rules.length}</p>
    <h2>${esc(r.title)}</h2><ol>${r.points.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>`));
  return slides;
}
function lessonSlide(item, kicker) {
  return `<div class="slide"><p class="kicker">${esc(kicker)}</p><h2>${esc(topic(item))}</h2>
    <p class="body">${esc(item.note)}</p>
    <p class="ask"><span class="label">Ask the class</span>${esc(item.ask)}</p>
    <p class="src">Source: ${esc(item.source)}</p></div>`;
}
function presentSlides(onlyMissed) {
  const pick = (ci, ri) => !onlyMissed || (state && state.used[ci + "-" + ri] === "taught");
  const slides = [`<div class="slide center"><p class="kicker">Presentation mode</p><h2>UX Trends: What We Learned</h2>
    <p class="body">${onlyMissed ? "Only the topics nobody got." : "Every topic from the board, one at a time."}</p></div>`];
  GAME.categories.forEach((c, ci) => {
    const clues = c.clues.map((cl, ri) => [cl, ri]).filter(([, ri]) => pick(ci, ri));
    if (!clues.length) return;
    slides.push(`<div class="slide center"><p class="kicker">Category</p><h2>${esc(c.name)}</h2>
      <p class="body">${clues.length} topic${clues.length > 1 ? "s" : ""}</p></div>`);
    clues.forEach(([cl]) => slides.push(lessonSlide(cl, `${c.name}, $${cl.value}`)));
  });
  if (!onlyMissed || (state && state.finalDone === "taught")) slides.push(lessonSlide(GAME.final, "Final Jeopardy, " + GAME.final.category));
  if (onlyMissed && slides.length === 1) slides.push(`<div class="slide center"><h2>Nothing to teach yet</h2>
    <p class="body">No clue has been missed so far. Switch to all topics to see every lesson.</p></div>`);
  slides.push(`<div class="slide"><p class="kicker">Sources</p><h2>Where this came from</h2><div class="sources">
    ${GAME.categories.map(c => `<h3>${esc(c.name)}</h3><ul>${c.clues.map(cl => `<li>$${cl.value}: ${esc(cl.source)}</li>`).join("")}</ul>`).join("")}
    <h3>Final Jeopardy</h3><ul><li>${esc(GAME.final.source)}</li></ul></div></div>`);
  return slides;
}
function openDeck(deck, extra = {}) { view = { kind: "deck", deck, i: 0, only: false, ...extra }; drawDeck(); }
function deckSlides() { return view.deck === "rules" ? rulesSlides() : presentSlides(view.only); }
function drawDeck() {
  Sound.stopMusic();
  const slides = deckSlides(), n = slides.length;
  view.i = Math.min(Math.max(0, view.i), n - 1);
  const last = view.i === n - 1;
  const title = view.deck === "rules" ? "Rules" : "Presentation mode";
  const toggle = view.deck === "present"
    ? `<button class="btn" id="deckOnly" type="button" aria-pressed="${view.only}">${view.only ? "Show all topics" : "Only missed topics"}</button>` : "";
  const nextLabel = last ? (view.start ? "Start the game" : "Done") : "Next";
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>${title}</span><span class="actions">${toggle}<button class="btn" data-close type="button">Close</button></span></div>
    <div class="ov-body">${slides[view.i]}</div>
    <div class="deck-foot"><button class="btn big" id="deckPrev" type="button" ${view.i ? "" : "disabled"}>Back</button>
      <span class="pos">${view.i + 1} / ${n}</span>
      <button class="btn primary big" id="deckNext" type="button">${nextLabel}</button></div>`;
  ov.hidden = false;
  ov.scrollTop = 0;
  $("#deckNext").focus({ preventScroll: true });
}
function deckStep(d) {
  const n = deckSlides().length;
  if (d > 0 && view.i === n - 1) { view = null; return drawOverlay(); }
  view.i += d; drawDeck();
}

/* ---------- Final Jeopardy ---------- */
function drawFinal() {
  Sound.stopMusic();
  const F = GAME.final, ov = $("#overlay");
  let body = "";
  if (view.step === "wager") {
    body = `<div class="big-word">Final Jeopardy</div>
      <p class="clue small">Category: ${esc(F.category)}</p>
      <p class="hint">Whole teams play this one. Each team writes down a secret wager, from $0 up to its score.</p>
      <div class="inline">${state.teams.map((t, i) => `<div class="field"><label for="fw-${i}">${esc(t.name)}, max ${money(Math.max(t.score, 0))}</label>
        <input id="fw-${i}" type="number" inputmode="numeric" min="0" max="${Math.max(t.score, 0)}" step="100" placeholder="0"></div>`).join("")}</div>
      <div class="actions"><button class="btn primary big" id="finalClue" type="button">Show the clue</button></div>`;
  } else if (view.step === "clue") {
    body = `<p class="clue">${esc(F.clue)}</p>
      ${timerHtml}
      <div class="actions"><button class="btn primary big" id="finalReveal" type="button">Reveal answer</button></div>`;
  } else if (view.step === "answer") {
    const done = state.teams.every((_, i) => view.judged[i]);
    body = `<p class="answer">${esc(F.answer)}</p>
      <div class="list" style="max-width:640px">${state.teams.map((t, i) => {
        const j = view.judged[i], w = view.wagers[i];
        return `<div class="inline" style="align-items:center;justify-content:space-between;max-width:none">
          <span class="status">${esc(t.name)}, bet ${money(w)}${j ? (j === "ok" ? ": correct" : ": wrong") : ""}</span>
          <span class="actions"><button class="btn right" data-fjudge="ok" data-i="${i}" type="button" ${j ? "disabled" : ""}>Correct</button>
          <button class="btn wrong" data-fjudge="no" data-i="${i}" type="button" ${j ? "disabled" : ""}>Wrong</button></span></div>`;
      }).join("")}</div>
      <div class="actions"><button class="btn primary big" id="finalDone" type="button" ${done ? "" : "disabled"}>See results</button></div>`;
  } else {
    const ranked = [...state.teams].sort((a, b) => b.score - a.score);
    const winners = ranked.filter(t => t.score === ranked[0].score).map(t => t.name);
    body = `<div class="big-word" style="font-size:clamp(36px,6vw,72px)">${esc(winners.join(" and "))} ${winners.length > 1 ? "tie" : "wins"}</div>
      <div class="stats">${ranked.map(t => `<div class="stat"><b>${money(t.score)}</b><span>${esc(t.name)}</span></div>`).join("")}</div>
      ${state.finalDone === "known" ? `<p class="status known">Someone got Final Jeopardy, so no lesson is needed.</p>` : lessonCard(F, "Final Jeopardy, " + F.category)}
      <div class="actions"><button class="btn primary big" id="openList" type="button">See all topics to teach</button>
        <button class="btn big" id="openPresent" type="button">Presentation mode</button></div>`;
  }
  ov.innerHTML = `<div class="ov-head"><span>Final Jeopardy: ${esc(F.category)}</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body">${body}</div>`;
  ov.hidden = false;
  (ov.querySelector(".ov-body input, .ov-body .btn.primary:not(:disabled), .ov-body .btn:not(:disabled)") || ov).focus({ preventScroll: true });
}

/* ---------- Events ---------- */
$("#setupForm").addEventListener("submit", e => {
  e.preventDefault();
  const teams = [...Array(TEAM_COUNT)].map((_, i) => ({
    name: $("#name-" + i).value.trim() || "Team " + (i + 1),
    players: [...Array(TEAM_SIZE)].map((_, j) => $(`#p-${i}-${j}`).value.trim() || `Player ${j + 1}`)
  }));
  state = newState(teams); showGame();
  Sound.prime();
  openDeck("rules", { start: true });
});

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "resume") { state = loadSaved(); return showGame(); }
  if (t.id === "menuBtn") return toggleMenu();
  if (t.closest("#menuList") && t.id !== "btnReset" && t.id !== "btnSound") toggleMenu(false);
  if (t.classList.contains("tile")) return selectTile(t);
  if (t.dataset.adj) { state.teams[t.dataset.i].score += Number(t.dataset.adj); return render(); }
  if (t.hasAttribute("data-close")) {
    // A team already missed: closing now counts as "nobody got it".
    if (view && !view.kind && (view.step === "clue" || view.step === "answer") && view.out.length) finishClue("taught");
    view = null; return drawOverlay();
  }
  if (t.id === "btnScores") { view = { kind: "scores" }; return drawScores(); }
  if (t.id === "btnList" || t.id === "openList") { view = { kind: "list" }; return drawList(); }
  if (t.id === "btnRules") return openDeck("rules");
  if (t.id === "btnPresent" || t.id === "openPresent") return openDeck("present");
  if (t.id === "deckPrev") return deckStep(-1);
  if (t.id === "deckNext") return deckStep(1);
  if (t.id === "deckOnly") { view.only = !view.only; view.i = 0; return drawDeck(); }
  if (t.id === "btnMusic") {
    if (Sound.playing) return Sound.stopMusic();
    Sound.prime(); return Sound.startMusic(30);
  }
  if (t.id === "btnFinal") { view = { kind: "final", step: state.finalDone ? "done" : "wager", wagers: [], judged: {} }; return drawFinal(); }
  if (t.id === "btnReset") {
    if (t.dataset.armed) { toggleMenu(false); return showSetup(); }
    t.dataset.armed = "1"; t.textContent = "Click again to end this game";
    setTimeout(() => { delete t.dataset.armed; t.textContent = "New game"; }, 3500);
    return;
  }

  // Clue flow
  if (t.id === "ddGo") {
    const max = Math.max(state.teams[view.team].score, 500);
    const w = Number($("#ddWager").value) || clueById(view.id).clue.value;
    view.wager = Math.min(Math.max(5, Math.round(w)), max);
    view.step = "clue"; drawOverlay(); return runTimer(30);
  }
  if (t.id === "btnFull") {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
    return;
  }
  if (t.id === "btnSound") { const on = Sound.toggle(); t.textContent = on ? "Sound on" : "Sound off"; t.setAttribute("aria-pressed", on); return; }
  if (t.id === "reveal") { view.step = "answer"; return drawOverlay(); }
  if (t.dataset.pick) { view.team = Number(t.dataset.pick); return drawOverlay(); }
  // Grab the winner's name before finishClue rotates players.
  const win = i => { view.winner = i; view.winnerName = playerUp(i); };
  if (t.dataset.judge) {
    const amount = view.wager ?? clueById(view.id).clue.value;
    if (t.dataset.judge === "right") {
      Sound.right(); state.teams[view.team].score += amount; win(view.team);
      finishClue("known"); view.step = "known"; return drawOverlay();
    }
    Sound.wrong();
    if (view.wager != null) {                      // Daily Double: the wager is lost
      state.teams[view.team].score -= amount;
      finishClue("taught"); view.step = "teach"; return drawOverlay();
    }
    view.out.push(view.team); view.team = null;
    if (!remaining().length) { finishClue("taught"); view.step = "teach"; return drawOverlay(); }
    return drawOverlay();
  }
  if (t.dataset.award) {
    const i = Number(t.dataset.award), amount = view.wager ?? clueById(view.id).clue.value;
    Sound.right(); state.teams[i].score += amount; win(i);
    finishClue("known"); view.step = "known"; return drawOverlay();
  }
  if (t.id === "nobody") {
    Sound.wrong();
    if (view.wager != null) state.teams[view.team].score -= view.wager;
    finishClue("taught"); view.step = "teach"; return drawOverlay();
  }
  if (t.id === "teachAnyway") { view.step = "review"; return drawOverlay(); }

  // Final flow
  if (t.id === "finalClue") {
    state.teams.forEach((tm, i) => { view.wagers[i] = Math.min(Math.max(0, Number($("#fw-" + i).value) || 0), Math.max(tm.score, 0)); });
    view.step = "clue"; drawFinal(); return runTimer(30);
  }
  if (t.id === "finalReveal") { view.step = "answer"; return drawFinal(); }
  if (t.dataset.fjudge) {
    const i = Number(t.dataset.i), w = view.wagers[i];
    view.judged[i] = t.dataset.fjudge;
    t.dataset.fjudge === "ok" ? Sound.right() : Sound.wrong();
    state.teams[i].score += t.dataset.fjudge === "ok" ? w : -w;
    render(); return drawFinal();
  }
  if (t.id === "finalDone") {
    state.finalDone = Object.values(view.judged).includes("ok") ? "known" : "taught";
    render(); view.step = "done"; return drawFinal();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#menuList").hidden) return toggleMenu(false);
  if (e.key === "Escape" && view) return document.querySelector("#overlay [data-close]")?.click();
  // Slide clickers send PageDown / PageUp; arrow keys work too.
  if (view && view.kind === "deck" && !e.target.closest("input")) {
    if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); deckStep(1); }
    if (["ArrowLeft", "PageUp"].includes(e.key) && view.i > 0) { e.preventDefault(); deckStep(-1); }
  }
});

/* ---------- Boot ---------- */
buildSetup();
function start(data) {
  if (data && data.state) { state = data.state; view = data.view || null; showGame(); drawOverlay(); }
  else showSetup();
}
window.claude?.hot?.snapshot?.(() => state ? { state, view } : {});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
