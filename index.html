<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UX Trends Jeopardy</title>
<style>
/* Fonts live in /fonts so the game looks right offline or on a school network that blocks Google. */
@font-face { font-family: "Anton"; font-weight: 400; font-display: swap; src: url(fonts/Anton-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/BarlowCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(fonts/BarlowCondensed-700.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 500; font-display: swap; src: url(fonts/Spectral-500.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 500; font-style: italic; font-display: swap; src: url(fonts/Spectral-500i.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 700; font-display: swap; src: url(fonts/Spectral-700.woff2) format("woff2"); }

/* Layout: game-show stage. Setup screen -> rules slides -> board with podiums -> full-screen clue.
   Missed clues open a lesson. Presentation mode walks through every lesson slide by slide.
   Gold is only for money and the main button. Anton for anything on the "TV",
   Spectral for reading, Barlow Condensed for controls. */
:root {
  color-scheme: dark;
  --night: #04050f;
  --gold: #eba43f;
  --ink: #ffffff;
  --ink-soft: #c3ccf7;
  --right: #3ddc97;
  --wrong: #ff8a8a;
  --tile-top: #1528c6;
  --tile-bottom: #0a17a4;
  --bezel: #03051a;
  --rim: #19226b;
  --lamp: #ffc861;
  --podium: #070b2c;
  --wood-top: #5b4127;
  --wood-bottom: #2a1d10;
  --wood-ink: #f1d7a8;
  --font-board: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-clue: "Spectral", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 600 17px/1.4 var(--font-ui);
  background: radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%) fixed var(--night);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.btn {
  border: 2px solid #000; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border-radius: 2px;
  padding: 8px 16px; font: 700 16px/1.1 var(--font-ui); text-transform: uppercase; letter-spacing: .05em;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn.primary { background: var(--gold); color: #000; }
.btn.big { padding: 12px 22px; font-size: 20px; }
.btn.right { background: #0d6b45; }
/* Live screen (projector): everything the host clicks is hidden; it only mirrors the control board. */
body.live .host-only, body.live .menu, body.live .host, body.live .btn, body.live input, body.live .wager label { display: none !important; }
body.live { cursor: none; }
body.live .ov-head { position: relative; min-height: 38px; }
body.live .ov-head .val { position: absolute; left: 50%; transform: translateX(-50%); }
.live-full.idle { opacity: 0; pointer-events: none; }
.live-full {
  position: fixed; z-index: 20; bottom: 16px; right: 16px; transition: opacity .3s; cursor: pointer; border: 2px solid #000; padding: 10px 18px;
  background: var(--gold); color: #000; font: 700 18px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .05em;
}
.live-badge {
  position: fixed; z-index: 20; left: 10px; bottom: 10px; padding: 4px 10px; border: 1px solid #000;
  background: #0d6b45; font: 700 13px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .06em;
}
.host-answer { margin: 0 0 4px; padding: 6px 8px; background: rgba(0, 0, 0, .35); font: 600 16px/1.3 var(--font-clue); max-width: 320px; white-space: normal; }
.host-answer b { display: block; font: 700 12px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
/* ---------- Control board console (laptop, while the live screen is open) ----------
   A tool, not a show: dark panels, small labels, status lights, compact controls. */
.console, .dash { --c-bg: #000; --c-panel: #0b0b10; --c-line: #2b2b38; --c-dim: #9a9ab0; --c-live: #3ddc6a; --c-amber: #f2c14e;
  --c-green: #33b249; --c-purple: #6a2ee8; --c-purple-dim: #2a1659; --c-red: #e03b3b; }
.console {
  position: fixed; z-index: 30; inset: 0 var(--dash-w) 0 0; overflow-y: auto; background: var(--c-bg);
  display: grid; align-content: start; gap: 10px; padding: 10px 12px; font: 600 15px/1.35 var(--font-ui); color: #e6e9f2;
}
.cb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 10px; background: var(--c-panel); border: 1px solid var(--c-line); }
.cb-bar .cb-title { color: #c9b8ff; }
.cb-title { font: 700 14px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c-dim); }
.cb-live { display: inline-flex; align-items: center; gap: 6px; font: 700 13px/1 var(--font-ui); letter-spacing: .1em; color: var(--c-live); }
.cb-live.off { color: var(--c-dim); } .cb-live.off::before { background: #555; box-shadow: none; }
.cb-live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c-live); box-shadow: 0 0 8px var(--c-live); }
.cb-status { font: 700 17px/1.2 var(--font-ui); }
.cb-tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; }
.cb-btn {
  border: 0; background: #2c2c3a; color: #fff; border-radius: 2px; padding: 7px 10px;
  font: 700 14px/1.1 var(--font-ui); text-transform: uppercase; letter-spacing: .04em;
}
.cb-btn:hover:not(:disabled) { filter: brightness(1.2); }
.cb-btn:active:not(:disabled) { filter: brightness(.85); }
.cb-btn.big { padding: 12px 16px; font-size: 18px; }
.cb-btn.go { background: var(--c-green); color: #000; }
.cb-btn.stop { background: var(--c-red); }
.cb-btn.main { background: var(--c-purple); }
.cb-btn.fx { background: var(--c-green); color: #000; }
.cb-btn kbd { display: inline-block; min-width: 1.4em; margin-right: 6px; padding: 0 4px; border: 1px solid rgba(255,255,255,.4); font: inherit; font-size: .8em; }
.cb-panel { background: var(--c-panel); border: 1px solid var(--c-line); padding: 10px; display: grid; gap: 8px; }
.cb-panel > h3 { color: var(--c-green); margin: 0; font: 700 12px/1.2 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--c-dim); }
.cb-boardwrap { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; }
.cb-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; background: #000; }
.cb-grid .cb-cat {
  display: grid; place-items: center; min-height: 38px; padding: 2px 4px; background: var(--c-green); color: #000; text-align: center;
  font: 700 12px/1.1 var(--font-ui); text-transform: uppercase; letter-spacing: .02em;
}
.cb-cell {
  position: relative; height: 44px; border: 0; background: var(--c-purple); color: #fff; border-radius: 0;
  font: 700 19px/1 var(--font-ui); font-variant-numeric: tabular-nums;
}
.cb-cell:hover:not(:disabled) { filter: brightness(1.2); }
.cb-cell.known { color: #9fe7b0; background: var(--c-purple-dim); }
.cb-cell.taught { color: #ff9b9b; background: var(--c-purple-dim); }
.cb-side { display: grid; align-content: start; gap: 5px; }
.cb-side .logo { font: 400 26px/1 var(--font-board); color: #c9b8ff; text-shadow: 2px 2px 0 #000; }
.cb-side .meta { font: 600 13px/1.35 var(--font-ui); color: var(--c-dim); margin-bottom: 4px; }
.cb-side .cb-btn { width: 100%; text-align: left; background: var(--c-purple); }
.cb-side .cb-btn.stop { background: var(--c-red); }
.cb-lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }
.cb-fx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.cb-cell.known, .cb-cell.taught { font-size: 13px; }
.cb-cell .dd { position: absolute; top: 2px; right: 3px; font-size: 10px; letter-spacing: .05em; color: #fff; background: #7a2530; padding: 0 3px; }
.cb-cell:disabled { opacity: .45; }
.cb-scores { width: 100%; border-collapse: collapse; }
.cb-scores td { padding: 5px 6px; border-top: 1px solid var(--c-line); }
.cb-scores .sc { font: 700 20px/1 var(--font-ui); font-variant-numeric: tabular-nums; text-align: right; }
.cb-scores .sc.neg { color: #ff8a8a; }
.cb-scores .pl { color: var(--c-dim); }
.cb-scores .pl b { color: #e6e9f2; }
.cb-scores .tag { font: 700 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--c-purple); padding: 2px 5px; margin-left: 6px; }
.cb-scores .adj { text-align: right; white-space: nowrap; }
.cb-cur-head { display: flex; justify-content: space-between; gap: 10px; font: 700 15px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .05em; }
.cb-cur-head .v { color: #c9b8ff; }
.cb-clue { font: 600 18px/1.4 var(--font-clue); }
/* The clue as a blue card, like the show's monitors. Grows in when a new clue opens. */
.cb-card {
  display: grid; place-items: center; min-height: 150px; padding: 18px 24px; text-align: center;
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 3px solid #000;
  font: 700 clamp(17px, 1.7vw, 24px)/1.3 var(--font-clue); text-transform: uppercase; color: #fff; text-shadow: 2px 2px 0 #000; text-wrap: balance;
}
.cb-card.dd { font: 400 clamp(36px, 4vw, 56px)/1 var(--font-board); }
.cb-card.pop { animation: cardIn .6s cubic-bezier(.25, .8, .3, 1); }
@keyframes cardIn { from { transform: scale(.12); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cb-card.pop { animation: none; } }
.cb-ans { padding: 6px 8px; background: #1a1430; border-left: 3px solid var(--c-purple); font: 700 17px/1.35 var(--font-clue); }
.cb-ans small { display: block; font: 700 11px/1.2 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: #c9b8ff; }
.cb-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.cb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--c-line); }
.cb-row .n { flex: 1 1 140px; font-weight: 700; }
.cb-input { width: 7ch; padding: 8px; background: #0b0e14; border: 1px solid var(--c-line); color: var(--c-amber); font: 700 18px/1 var(--font-ui); text-align: right; }
.cb-note { color: var(--c-dim); font-weight: 600; }
.cb-res-ok { color: var(--c-live); font-weight: 700; } .cb-res-no { color: #ff8a8a; font-weight: 700; }
body.has-dash #game, body.has-dash #overlay, body.has-dash .menu { display: none !important; }
/* Setup screen on the control board: same console look. */
body.has-dash { background: #000; }
body.has-dash .setup { background: #000; place-items: start stretch; padding: 10px 12px; }
body.has-dash .setup-card { max-width: none; gap: 10px; text-align: left; }
body.has-dash .setup-card .title { font: 700 14px/1 var(--font-ui); letter-spacing: .14em; color: #c9b8ff; text-shadow: none; padding: 12px 10px; background: #0b0b10; border: 1px solid #2b2b38; }
body.has-dash .setup-card > p { font: 600 15px/1.4 var(--font-ui); color: #9a9ab0; }
body.has-dash .team-setup fieldset { background: #0b0b10; border: 1px solid #2b2b38; }
body.has-dash .team-setup input { background: #000; border: 1px solid #2b2b38; color: #fff; }
body.has-dash .team-setup input.team-name { background: #33b249; color: #000; border: 0; font: 700 18px/1.2 var(--font-ui); }
body.has-dash .team-setup input.team-name::placeholder { color: rgba(0, 0, 0, .55); }
body.has-dash .setup-actions { justify-content: flex-start; }
body.has-dash .setup-actions .btn { background: #2c2c3a; color: #fff; border: 0; border-radius: 2px; }
body.has-dash .setup-actions .btn.primary { background: #6a2ee8; }

/* Control board: when the live screen is open, this window becomes a tool, not a show.
   Left: plain board and big host buttons. Right: projector preview, what to say, what's next, music, sounds. */
:root { --dash-w: min(40vw, 560px); }
.dash {
  position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: var(--dash-w); overflow-y: auto;
  display: grid; align-content: start; gap: 10px; padding: 10px 12px 10px 0; background: var(--c-bg);
}
.dash-sec { display: grid; gap: 6px; padding: 10px; background: var(--c-panel); border: 1px solid var(--c-line); }
.dash-sec h3 { margin: 0; font: 700 12px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .12em; color: var(--c-dim); }
.dash-sec h3 { color: var(--c-green); }
.dash-sec.say div { font: 500 19px/1.45 var(--font-clue); }
.dash-sec.say q { font-weight: 700; quotes: "\201C" "\201D"; }
.dash-sec.ans { background: #1a1430; border-left: 3px solid var(--c-purple); }
.dash-sec.ans div { font: 700 20px/1.35 var(--font-clue); }
.dash-sec.next div { font: 600 17px/1.4 var(--font-ui); color: #d8defc; }
.dash-row { display: flex; flex-wrap: wrap; gap: 6px; }
.dash-row .btn { font-size: 14px; padding: 7px 10px; }
.preview { position: relative; overflow: hidden; border: 2px solid #000; background: #000; aspect-ratio: 16 / 9; }
.preview iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; border: 0; transform-origin: 0 0; pointer-events: none; }
body.has-dash .app, body.has-dash .setup { margin-right: var(--dash-w); }
body.has-dash .overlay { right: var(--dash-w); background: #0b1033; animation: none; }
body.has-dash .overlay::before, body.has-dash .live-badge, body.has-dash .host-tab, body.has-dash .host-answer { display: none; }
body.has-dash .lamps, body.has-dash .pillar, body.has-dash .floor { display: none; }
body.has-dash .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
body.has-dash .bezel { grid-column: 1; grid-row: 1; }
body.has-dash .board { min-width: 0; }
body.has-dash .podium .p-score { min-width: 3.2em; font-size: clamp(18px, 1.8vw, 28px); }
body.has-dash .podium .p-team { overflow-wrap: normal; font-size: clamp(14px, 1.3vw, 18px); }
body.has-dash .tile { font-size: clamp(20px, 2.4vw, 40px); }
body.has-dash .cat { font-size: clamp(13px, 1.3vw, 20px); }
body.has-dash .menu { right: calc(var(--dash-w) + 8px); }
body.has-dash .clue { font-size: clamp(18px, 1.8vw, 26px); text-shadow: none; }
body.has-dash .big-word { font-size: clamp(36px, 5vw, 64px); }
body.has-dash .slide h2 { font-size: clamp(26px, 3vw, 44px); }
body.has-dash .slide .body, body.has-dash .slide .ask, body.has-dash .slide ol { font-size: clamp(16px, 1.5vw, 20px); }
body.has-dash .host { position: static; width: 100%; max-width: 760px; }
body.has-dash .host-panel {
  display: flex !important; position: static; flex-direction: row; flex-wrap: wrap; justify-content: center;
  min-width: 0; padding: 0; margin: 0; background: none; border: 0; box-shadow: none;
}
body.has-dash .host-panel::after { display: none; }
body.has-dash .host-panel .btn { font-size: 20px; padding: 12px 18px; }
.host { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 2; }
.host-tab {
  opacity: .5; border: 1px solid var(--rim); background: var(--bezel); padding: 6px 12px;
  font: 700 14px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); transition: opacity .15s;
}
.host-panel {
  display: none; position: absolute; right: 0; bottom: 100%; flex-direction: column; align-items: stretch; gap: 6px;
  min-width: 240px; padding: 8px; margin-bottom: 6px; background: var(--podium); border: 2px solid #000; box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
}
.host:hover .host-tab, .host:focus-within .host-tab { opacity: 1; }
.host:hover .host-panel, .host:focus-within .host-panel, .host.open .host-panel { display: flex; }
.host-panel .btn { text-align: left; white-space: nowrap; }
/* Invisible bridge so the panel doesn't close while the mouse moves up from the tab. */
.host-panel::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; }
.btn kbd { display: inline-block; min-width: 1.4em; margin-right: 6px; padding: 0 4px; border: 1px solid rgba(255, 255, 255, .5); font: inherit; font-size: .8em; }
.btn.wrong { background: #8a1f2b; }
.title { margin: 0; font: 400 clamp(36px, 6vw, 72px)/1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; text-shadow: 4px 4px 0 #000; }

/* Setup */
.setup { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 32px; }
.setup-card { width: 100%; max-width: 1000px; display: grid; gap: 22px; text-align: center; }
.setup-card > p { margin: 0; font: 500 clamp(17px, 1.8vw, 21px)/1.4 var(--font-clue); color: var(--ink-soft); }
.team-setup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; text-align: left; }
.team-setup fieldset {
  margin: 0; border: 3px solid #000; padding: 14px; display: grid; gap: 8px;
  background: linear-gradient(var(--wood-top), var(--wood-bottom));
}
.team-setup input, .field input {
  width: 100%; background: rgba(0, 0, 20, .55); border: 1px solid #000; border-radius: 0; padding: 8px 10px; font: 600 18px/1.2 var(--font-ui);
}
.team-setup input.team-name {
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000; margin-bottom: 4px;
  font: 400 24px/1.2 var(--font-board); text-transform: uppercase; letter-spacing: .03em; text-align: center;
}
.team-setup input::placeholder { color: rgba(255, 255, 255, .45); }
.setup-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 760px) { .team-setup { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field label { font: 700 16px/1.2 var(--font-ui); color: var(--ink-soft); }

/* Game: the TV set. Bronze top band with a row of lights, orange ladder pillars edged in blue,
   a charcoal frame around a flat blue board split by black lines, a blue neon floor. */
.app {
  height: 100%; min-height: 540px; display: flex; flex-direction: column; gap: 8px;
  padding-inline: 16px; padding-block: 10px;
  background:
    radial-gradient(circle at 96% 62%, rgba(150, 60, 210, .35), transparent 28%),
    radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%);
}
.stage {
  flex: 1; min-height: 0; width: 100%; max-width: 1500px; margin: 0 auto;
  display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px; grid-template-rows: 40px 1fr 20px; column-gap: 18px;
}
.lamps {
  grid-column: 1 / -1; position: relative; border-radius: 10px 10px 0 0;
  background: linear-gradient(#2c1e12, #70502e 45%, #3a2817 80%, #1a120b);
  box-shadow: 0 2px 0 #000;
}
.lamps::before {
  content: ""; position: absolute; left: 2%; right: 2%; top: 7px; height: 3px; border-radius: 2px;
  background: var(--lamp); box-shadow: 0 0 6px var(--lamp), 0 8px 0 #c98d3f, 0 8px 6px rgba(255, 190, 90, .6);
}
.lamps::after {
  content: ""; position: absolute; left: 3%; right: 3%; bottom: 5px; height: 9px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #cfe8ff 0 52px, #1d2846 52px 58px);
  box-shadow: 0 0 10px rgba(160, 210, 255, .8);
}
.pillar {
  grid-row: 2; display: grid; grid-template-rows: repeat(10, 1fr); padding: 10px 12px; margin-block: 8px;
  background: #0a0e2c; border: 4px solid #5aa8ff; border-radius: 3px;
  box-shadow: 0 0 12px rgba(90, 168, 255, .9), 0 0 30px rgba(60, 120, 255, .45), inset 0 0 10px rgba(90, 168, 255, .55);
}
.pillar i {
  margin-inline: -22px;
  background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat;
}
.pillar i:last-child { background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(#a3a5ad, #6a6d75) bottom / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat; }
.bezel {
  grid-row: 2; grid-column: 2; display: flex; padding: 12px; border-radius: 12px; overflow-x: auto;
  background: linear-gradient(#24252c, #141519); box-shadow: inset 0 0 0 2px #31333c, 0 0 0 2px #050507;
}
.board {
  flex: 1; min-width: 720px; display: grid; grid-template-columns: repeat(6, 1fr);
  grid-template-rows: 1fr repeat(5, 1fr); gap: 6px; padding: 6px; background: #000;
}
.floor {

<script>
/* =====================================================================
   GAME CONTENT. Edit anything in GAME to change the questions.
   Each clue has: value, clue (read aloud), answer, note (what you say
   if nobody gets it), ask (a question for the class) and source.
   Questions written by the class team (Chris, Braydon, Joaquin).
   "Class reading" = the UX trends paper we read. Put its full title
   in READING below and it shows up everywhere.
   ===================================================================== */
const READING = "Class reading: UX trends paper";
const GAME = {
  rules: [
    { title: "How it works", points: [
      "Three teams of four.",
      "Each team sends one player up to the podium at a time.",
      "After every clue, the next player on each team comes up. Everyone plays.",
      "Teammates stay quiet while a clue is live."
    ]},
    { title: "Buzzing in", points: [
      "The first team on the list picks first. After that, whoever gets a clue right picks the next one.",
      "Wait until the whole clue is read, then hit your buzzer. First buzz answers.",
      "Answer in the form of a question: \"What is...?\" or \"Who is...?\"",
      "Get it right and your team earns the money."
    ]},
    { title: "Wrong answers", points: [
      "Miss it, and the other players can buzz in.",
      "A wrong answer doesn't cost you anything, except on a Daily Double.",
      "If nobody gets it, we stop and teach that topic, and the same team picks again."
    ]},
    { title: "Daily Double and Final", points: [
      "One clue on the board is a Daily Double. The player up bets $5 up to their team's score (or $500), and answers alone.",
      "Final Jeopardy comes at the end. Each team writes a secret bet on paper, and the whole team works on the answer together. Teams with $0 or less sit it out.",
      "Most money at the end wins."
    ]}
  ],
  categories: [
    { name: "UX-cellent", about: "What's new in UX for 2026: accessibility, dashboards, designing for AI, and proving that design pays off.", clues: [
      { value: 100, clue: "What 2026 accessibility framework replaces rigid pass/fail audit checklists with persistent toggles so users can customize font size, contrast, and motion themselves?",
        answer: "What is Comfort Mode?",
        note: "Instead of checking boxes on an audit, the app hands the settings to the user. Bigger text, more contrast, less motion, and it remembers what you picked. Your phone already does a version of this in Settings > Accessibility. The paper we read says accessibility is a requirement now, and in Europe it's the law.",
        ask: "Which of those settings would you actually turn on?",
        source: READING + "; European Accessibility Act, Directive (EU) 2019/882, in force June 2025." },

/* ===================== GAME LOGIC ===================== */
/* ---------- Control board + live screen ----------
   The normal page is the control board. "Open live screen" opens this same page with ?screen=live;
   drag that window onto the projector. The control board sends the whole game to it after every
   change (BroadcastChannel, same computer and browser only). Sounds play from the control board. */
const LIVE = new URLSearchParams(location.search).get("screen") === "live";
const PREVIEW = LIVE && new URLSearchParams(location.search).has("preview");   // the mini copy inside the control board
const chan = "BroadcastChannel" in window ? new BroadcastChannel("ux-jeopardy-live") : null;
let liveOn = false, lastPing = 0, syncQueued = false, syncZoom = null, syncTimer = null, liveTick = null, lastViewJSON = null;

function scheduleSync() {
  if (LIVE || !chan || syncQueued) return;
  syncQueued = true;
  queueMicrotask(() => {
    syncQueued = false;
    chan.postMessage({ type: "state", phase: $("#game").hidden ? "setup" : "game", state, view, zoom: syncZoom, timer: syncTimer });
    syncZoom = syncTimer = null;
    updateDash();
  });
}
function openLive() {
  const url = location.pathname + "?screen=live";
  const w = window.open(url, "ux-jeopardy-live", "popup,width=1280,height=720");
  if (!w) alert("Your browser blocked the live screen window. Allow pop-ups for this site, then try again.");
}
// The laptop window is always the control board; the show view lives in the projector window
// (and in the mini preview). Whether the projector window is open only changes the status light.
function startControl() {
  document.body.classList.add("has-dash");
  $("#dash").hidden = false;
  $("#preview").src = location.pathname + "?screen=live&preview=1";
  fitPreview(); updateDash();
}
function setLiveOn(on) {
  if (on === liveOn) return;
  liveOn = on;
  updateDash();
  document.querySelectorAll("button[data-open-live]").forEach(b => { (b.querySelector(".lbl") || b).textContent = on ? "Live screen is open" : "Open live screen"; });
}
if (!LIVE && chan) {
  chan.onmessage = ({ data }) => {
    if (data.type === "hello" || data.type === "ping") {
      lastPing = Date.now(); setLiveOn(true);
      if (data.type === "hello") { lastViewJSON = null; scheduleSync(); }
    }
    if (data.type === "bye") setLiveOn(false);
    if (data.type === "preview-hello") scheduleSync();
  };
  setInterval(() => { if (liveOn && Date.now() - lastPing > 5000) setLiveOn(false); }, 2000);
  setInterval(() => { const m = $("#dashMusic"); if (m) m.textContent = Sound.playing ? "Stop music" : "Thinking music"; }, 1000);
}

/* What the host should say right now, the answer (if any), and what happens next. */
function hostCue() {
  const q = t => `<q>${esc(t)}</q>`;
  if ($("#game").hidden || !state) return { say: "Type the team names and players, then press Start game.", next: "The rules slides come up first." };
  const nameOf = i => state.teams[i].name, up = i => state.teams[i].players[state.rot % TEAM_SIZE];
  if (!view && state.intro) {
    const it = state.intro, n = GAME.categories.length;
    if (!it.filled) return { say: q("Let's take a look at today's board!"), next: "Click Fill the board (or press →). The amounts pop in." };
    if (it.shown === 0) return { say: q("Here are today's categories."), next: "Click Reveal category 1 (or press →)." };
    const c = GAME.categories[it.shown - 1];
    return { say: q(`${it.shown === 1 ? "First up" : it.shown === n ? "And our last category" : "Next"}: ${c.name}.`) + ` ${esc(c.about)}`,
             next: it.shown < n ? `Click Reveal category ${it.shown + 1} (or press →).` : `Click Start playing. ${nameOf(state.turn)} picks first.` };
  }
  if (!view) {
    const left = GAME.categories.length * 5 - Object.keys(state.used).length;
    if (!left) return state.finalDone
      ? { say: "That's the game! Thanks for playing.", next: "Open Presentation mode or Topics to teach from the menu." }
      : { say: `That's the end of the board. ${q("It's time for Final Jeopardy!")}`, next: "Click Play Final Jeopardy under the board." };
    return { say: q(`${nameOf(state.turn)}, pick a category and an amount.`) + ` At the podium: ${state.teams.map((_, i) => up(i)).join(", ")}.`,
             next: "Click the square they pick." };
  }
  if (view.kind === "deck") {
    const sl = deckSlides(), cur = sl[Math.min(view.i, sl.length - 1)], last = view.i >= sl.length - 1;
    return { say: esc(cur.say || ""), next: last ? (view.start ? "Click Show the board (or press →)." : "Click Done to go back to the board.") : "Click Next (or press →) for the next slide." };
  }
  if (view.kind === "scores") return { say: "", next: "Use −100 and +100 to fix a score, then Close." };
  if (view.kind === "list") return { say: "These are the topics nobody got. Go over them now, or later in Presentation mode.", next: "Close when you're done." };
  if (view.kind === "final") {
    const F = GAME.final;
    if (view.step === "wager") return { say: q(`The Final Jeopardy category is ${F.category}. Write your bet on paper, from zero up to your score. Don't show anyone.`), next: "When every team has a bet written down, click Show the clue." };
    if (view.step === "clue") return { say: `Read it out: ${q(F.clue)} Teams, you have 30 seconds.`, answer: F.answer, next: "When time's up, click Reveal answer." };
    if (view.step === "answer") return { say: `${q(`The answer is: ${F.answer}`)} ${q("Show me your bets!")}`, answer: F.answer, next: "Type each team's bet, then mark it Correct or Wrong. Then See results." };
    const ranked = [...state.teams].sort((a, b) => b.score - a.score);
    return { say: q(`Congratulations, ${ranked[0].name}! You win with ${money(ranked[0].score)}.`), next: "Open Presentation mode to go over what you learned." };
  }
  const { clue } = clueById(view.id), amount = view.wager ?? clue.value;
  switch (view.step) {
    case "dd": return { say: q(`It's a Daily Double! ${up(view.team)}, this one is just for you. How much do you want to bet?`) + ` From $5 up to ${money(Math.max(state.teams[view.team].score, 500))}.`, next: "Type the bet, then click Show the clue." };
    case "clue":
      if (view.wager != null) return { say: `Read it out: ${q(clue.clue)}`, answer: clue.answer, next: `Only ${up(view.team)} answers. Click Correct or Wrong.` };
      if (view.team != null) return { say: q(`${up(view.team)}?`), answer: clue.answer, next: "Click Correct or Wrong." };
      if (view.out.length) return { say: q("Anyone else? Buzz in!"), answer: clue.answer, next: "Click who buzzed next (or press 1, 2, 3), or Show answer if nobody does." };
      return { say: `Read it out: ${q(clue.clue)}`, answer: clue.answer, next: "Players buzz in. Click who buzzed first (or press 1, 2, 3)." };
    case "answer": return { say: q(`The answer is: ${clue.answer}`), answer: clue.answer, next: "Click who got it, or Nobody got it." };
    case "known": return { say: q(`That's right! ${money(amount)} to ${nameOf(view.winner)}. ${nameOf(view.winner)}, you pick next.`), next: "Click Back to board." };
    case "teach": case "review": return { say: `${esc(clue.note)} Then ask: ${q(clue.ask)}`, next: "Click Back to board when you're done." };
  }
  return { say: "", next: "" };
}
/* ---------- Console (left side of the control board) ---------- */
function renderConsole() {
  const el = $("#console");
  const inGame = !$("#game").hidden && state;
  el.hidden = !inGame;
  if (!inGame) return;
  const total = GAME.categories.length * 5, played = Object.keys(state.used).length, left = total - played;
  const nameOf = i => esc(state.teams[i].name), up = i => esc(state.teams[i].players[state.rot % TEAM_SIZE]);
  const B = (attrs, label, cls = "") => `<button type="button" class="cb-btn ${cls}" ${attrs}>${label}</button>`;

  // Status line
  let status;
  if (!view && state.intro) status = "Board intro";
  else if (!view) status = left ? `${nameOf(state.turn)} picking` : (state.finalDone ? "Game over" : "Board cleared");
  else if (view.kind === "deck") status = { rules: "Rules slides", cats: "Category reveal", present: "Presentation mode" }[view.deck];
  else if (view.kind === "final") status = "Final Jeopardy";
  else if (view.kind === "scores") status = "Fixing scores";
  else if (view.kind === "list") status = "Topics to teach";
  else status = { dd: "Daily Double: wager", clue: view.team != null ? `${up(view.team)} answering` : (view.out.length ? "Waiting for another buzz" : "Clue up, waiting for buzz"),
                  answer: "Answer revealed", known: "Got it", teach: "Nobody got it: teach", review: "Reviewing a played clue" }[view.step] || "";

  // Board grid
  const busy = !!view || !!state.intro;
  const shown = state.intro ? state.intro.shown : GAME.categories.length;
  let grid = GAME.categories.map((c, i) => `<div class="cb-cat"${i < shown ? "" : ' style="opacity:.35"'}>${esc(c.name)}</div>`).join("");
  for (let r = 0; r < 5; r++) GAME.categories.forEach((c, ci) => {
    const id = ci + "-" + r, u = state.used[id], v = c.clues[r].value;
    const label = u === "known" ? "Got it" : u === "taught" ? "Missed" : "$" + v;
    grid += `<button type="button" class="cb-cell ${u || ""}" data-cell="${id}" ${busy ? "disabled" : ""} title="${esc(c.name)}, $${v}">${label}${!u && id === state.dd ? '<span class="dd">DD</span>' : ""}</button>`;
  });

  // Scores
  const scores = state.teams.map((t, i) => `<tr>
    <td><b>${esc(t.name)}</b>${left && i === state.turn ? '<span class="tag">Picks</span>' : ""}</td>
    <td class="pl">${t.players.map((p, j) => j === state.rot % TEAM_SIZE ? `<b>${esc(p)}</b>` : esc(p)).join(", ")}</td>
    <td class="sc${t.score < 0 ? " neg" : ""}">${money(t.score)}</td>
    <td class="adj">${B(`data-adj="-100" data-i="${i}" aria-label="Take 100 from ${esc(t.name)}"`, "−100")} ${B(`data-adj="100" data-i="${i}" aria-label="Give 100 to ${esc(t.name)}"`, "+100")}</td></tr>`).join("");

  el.innerHTML = `
    <div class="cb-bar">
      <span class="cb-title">Control board</span>${liveOn ? '<span class="cb-live">Projector on</span>' : `<span class="cb-live off">Projector off</span>${B("data-open-live", "Open live screen", "main")}`}
      <span class="cb-status">${status}</span>
    </div>
    <section class="cb-panel"><h3>Current</h3>${consoleCurrent(B, nameOf, up, left)}</section>
    <section class="cb-panel"><h3>Board${state.intro ? " (finish the board intro first)" : busy ? " (finish the current clue first)" : ": tap the square they pick"}</h3>
      <div class="cb-boardwrap">
        <div class="cb-grid">${grid}</div>
        <div class="cb-side">
          <div class="logo">Jeopardy!</div>
          <div class="meta">${played} of ${total} played<br>${left ? `${nameOf(state.turn)} picks` : "Board cleared"}</div>
          ${B('data-go="btnRules"', "Rules")}${B('data-go="btnCats"', "Categories")}${B('data-go="btnPresent"', "Presentation")}${B('data-go="btnList"', "Topics to teach")}
          ${B('data-go="btnFinal"', "Final Jeopardy")}${B('data-go="btnFull"', "Full screen")}${B("data-newgame", "New game", "stop")}
        </div>

const MUSIC_FILE = "thinking-music.mp3";
const MusicStore = {   // IndexedDB holds the picked file so it survives a reload

  get() { return this.run("readonly", st => st.get("music")).catch(() => null); },
  set(blob) { return this.run("readwrite", st => st.put(blob, "music")).catch(() => {}); },
  clear() { return this.run("readwrite", st => st.delete("music")).catch(() => {}); }
};

    72,0,69,65, 69,72,0,0,   67,0,70,72, 76,0,0,0,
    65,0,69,72, 77,0,72,0,   70,0,74,77, 82,0,79,0,

/* Board intro, like the show: the board starts empty, the dollar amounts fill in a few at a time,
   then the host reveals the categories one by one and each title swipes in.

let seenIntro = null;
function render() {
  const b = $("#board"), n = GAME.categories.length;
  const intro = state.intro, cur = { filled: !intro || intro.filled, shown: intro ? intro.shown : n };
  const prev = seenIntro || cur; seenIntro = cur;
  let h = GAME.categories.map((c, i) => i < cur.shown
    ? `<div class="cat${i >= prev.shown ? " swipe" : ""}">${esc(c.name)}</div>`
    : `<div class="cat" aria-hidden="true"></div>`).join("");
  for (let r = 0; r < 5; r++) GAME.categories.forEach((c, ci) => {
    const id = ci + "-" + r, clue = c.clues[r], used = state.used[id];
    const label = used ? `${c.name}, $${clue.value}, played. Open to review the lesson.` : `${c.name} for $${clue.value}`;
    h += `<button type="button" class="tile${used ? " used" : ""}${cur.filled ? "" : " blank"}" data-id="${id}" aria-label="${esc(label)}">$${clue.value.toLocaleString()}</button>`;
  });

  if (!prev.filled && cur.filled) fillBoard(b);

  else if (LIVE) tl.textContent = "Final Jeopardy";

    <div class="podium${left && i === state.turn ? " up" : ""}">

      <span class="p-player">${esc(playerUp(i))}</span>
    </div>`).join("");
  if (view && view.kind === "scores") drawScores();

  const missed = Object.values(state.used).filter(v => v === "taught").length + (state.finalDone === "taught" ? 1 : 0);
  $("#missCount").textContent = missed; $("#missCount").dataset.n = missed;
  if (!LIVE) save();
  scheduleSync();
}

// Dollar amounts pop in a few squares at a time, in random order (about one second in all).
function fillBoard(b) {
  const tiles = [...b.querySelectorAll(".tile:not(.used)")];
  if (reduceMotion()) return;
  tiles.forEach(t => t.classList.add("blank"));
  tiles.sort(() => Math.random() - .5);
  for (let i = 0; i < tiles.length; i += 4) setTimeout(() => tiles.slice(i, i + 4).forEach(t => t.classList.remove("blank")), 120 * (i / 4));
}
function introStep() {
  const it = state.intro; if (!it) return;
  if (!it.filled) { it.filled = true; Sound.prime(); Sound.fill(); }
  else if (it.shown < GAME.categories.length) { it.shown++; Sound.swipe(); }
  else delete state.intro;
  render();
}

/* ---------- Clue overlay ---------- */
const topic = item => item.answer.replace(/^(What|Who) (is|are) /, "").replace(/\?$/, "");
function lessonCard(item, where) {
  return `<article class="lesson">
    <h2>${esc(topic(item))}</h2>
    ${where ? `<p class="where">${esc(where)}</p>` : ""}
    <p>${esc(item.note)}</p>
    <p class="ask">${esc(item.ask)}</p>
    <p class="src">Source: ${esc(item.source)}</p>
  </article>`;
}

function openClue(id) {
  if (state.used[id]) { view = { id, step: "review" }; return drawOverlay(); }
  if (id === state.dd) {
    view = { id, step: "dd", team: state.turn, out: [], wager: null };
    drawOverlay(); return Sound.dailyDouble();
  }
  // The team that's up answers first. If they miss, another team can steal.
  // Nobody is answering yet: the first player to hit their buzzer gets it.
  view = { id, step: "clue", team: null, out: [], wager: null };
  drawOverlay(); runTimer(30);
}
const allTeams = () => state.teams.map((_, i) => i);
const remaining = () => allTeams().filter(i => !view.out.includes(i));
let selecting = false;
function selectTile(el) {
  const id = el.dataset.id || el.dataset.cell;
  if (selecting) return;
  if (state.intro) return;
  if (state.used[id]) return openClue(id);
  selecting = true;
  el.classList.add("selected");
  Sound.prime();
  // Flash the square, then the clue card grows out of it to fill the screen.
  if (chan) chan.postMessage({ type: "select", id });
  setTimeout(() => { selecting = false; zoomFrom = el.getBoundingClientRect(); syncZoom = id; openClue(id); }, reduceMotion() ? 0 : 250);
}
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let zoomFrom = null;
// Like the show: the clue card starts the size of its square and grows to fill the screen.
// Only the clue text rides along; the buttons and top bar fade in once it lands.
function zoomIn(ov) {
  const r = zoomFrom; zoomFrom = null;
  if (!r || reduceMotion() || !ov.animate || document.body.classList.contains("has-dash")) return;
  const sx = r.width / innerWidth, sy = r.height / innerHeight;
  // Turn off the normal fade-in for this opening; switching it back on mid-way would replay it and jump.
  ov.style.animation = "none";
  ov.classList.add("zooming");
  ov.animate([
    { transform: `translate(${r.left}px, ${r.top}px) scale(${sx}, ${sy})` },
    { transform: "none" }
  ], { duration: 700, easing: "cubic-bezier(.25, .8, .3, 1)" })
    .finished.then(() => ov.classList.remove("zooming"), () => ov.classList.remove("zooming"));
}
function toggleMenu(force) {
  const list = $("#menuList"), open = force ?? list.hidden;
  list.hidden = !open; $("#menu").classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", open);
  setLabel("#btnMusic", Sound.playing ? "Stop music" : "Play thinking music");
  setLabel("#btnPickMusic", Sound.custom ? "Change music file" : "Choose music file");
  $("#btnClearMusic").hidden = !Sound.custom;
}
document.addEventListener("fullscreenchange", () => setLabel("#btnFull", document.fullscreenElement ? "Exit full screen" : "Full screen"));
document.addEventListener("pointerdown", e => { if (!e.target.closest("#menu") && !$("#menuList").hidden) toggleMenu(false); });

function finishClue(result, winner) { state.used[view.id] = result; nextTurn(winner); render(); }

// Host-only buttons live in a small tab in the bottom-right corner and open on hover (or tap),
// so the class sees just the clue.
let hostOpen = false;   // stays open between clicks until the mouse leaves the tab
// With a live screen on the projector, this screen is private: keep the panel open and show the answer.
const hostPanel = (inner, answer) => `<div class="host${hostOpen || liveOn ? " open" : ""}"><button class="host-tab" type="button" aria-label="Host controls">Host</button><div class="host-panel">${liveOn && answer ? `<p class="host-answer"><b>Answer</b>${esc(answer)}</p>` : ""}${inner}</div></div>`;
function drawOverlay() {
  Sound.stopMusic(); clearInterval(liveTick); scheduleSync();
  const ov = $("#overlay");
  if (!view) { ov.hidden = true; ov.innerHTML = ""; ov.style.animation = ""; return; }
  if (view.kind === "list") return drawList();
  if (view.kind === "scores") return drawScores();
  if (view.kind === "final") return drawFinal();
  if (view.kind === "deck") return drawDeck();

  const { cat, clue } = clueById(view.id);
  const team = state.teams[view.team];
  const amount = view.wager ?? clue.value;
  const nameOf = i => esc(state.teams[i].name);
  const whoOf = i => `${esc(playerUp(i))}<small>for ${nameOf(i)}</small>`;
  // Who missed is for the host only (the control board shows it); the projector just shows the clue.
  const missed = "";
  let body = "";

  switch (view.step) {
    case "dd": {
      const max = Math.max(team.score, 500);
      body = `<div class="big-word">Daily Double</div>
        <p class="status">${esc(playerUp(view.team))} plays this one alone for ${esc(team.name)}.</p>
        <div class="wager"><label for="ddWager">Wager, $5 to $${max.toLocaleString()}</label>
          <input id="ddWager" type="number" inputmode="numeric" min="5" max="${max}" step="100" placeholder="${clue.value}"></div>
        <div class="actions"><button class="btn primary big" id="ddGo" type="button">Show the clue</button></div>`;
      break;
    }
    case "clue": {
      let who, buttons = "";
      if (view.team != null) {
        who = `<p class="who">${whoOf(view.team)}</p>`;
        buttons = `<button class="btn right" data-judge="right" type="button">Correct, +$${amount.toLocaleString()}</button>
          <button class="btn wrong" data-judge="wrong" type="button">Wrong${view.wager != null ? ", -$" + amount.toLocaleString() : ""}</button>`;
      } else {
        who = "";
        buttons = remaining().map(i => `<button class="btn" data-pick="${i}" type="button"><kbd>${i + 1}</kbd> ${esc(playerUp(i))} (${nameOf(i)})</button>`).join("");
      }
      body = `${who}
        <p class="clue">${esc(clue.clue)}</p>
        ${missed}
        ${view.out.length ? "" : timerHtml}
        ${hostPanel(`${buttons}<button class="btn" id="reveal" type="button">Show answer</button>`, clue.answer)}`;
      break;
    }
    case "answer": {
      const can = view.wager != null ? [view.team] : remaining();
      body = `<p class="clue small">${esc(clue.clue)}</p>
        <p class="answer">${esc(clue.answer)}</p>
        ${missed}
        ${hostPanel(`${can.map(i => `<button class="btn right" data-award="${i}" type="button"><kbd>${i + 1}</kbd> ${esc(playerUp(i))} (${nameOf(i)}) got it</button>`).join("")}
          <button class="btn wrong" id="nobody" type="button">Nobody got it</button>`)}`;
      break;
    }
    case "known":
      body = `        <p class="answer">${esc(clue.answer)}</p>
        <div class="actions"><button class="btn primary big" data-close type="button">Back to board</button>
          <button class="btn big" id="teachAnyway" type="button">Show the lesson anyway</button></div>`;
      break;
    case "teach":
    case "review":
      body = `${lessonCard(clue)}
        <div class="actions"><button class="btn primary big" data-close type="button">Back to board</button></div>`;
      break;
  }

  const val = view.wager != null ? "Daily Double, " + money(amount) : money(clue.value);
  ov.innerHTML = `<div class="ov-head"><span>${esc(cat.name)}</span><span class="val">${val}</span>
    <button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body">${body}</div>`;
  ov.hidden = false;
  zoomIn(ov);
  (ov.querySelector(".ov-body input, .ov-body .btn.primary, .ov-body > .actions .btn") || ov).focus({ preventScroll: true });
}

/* ---------- Scores ---------- */
function drawScores() {
  scheduleSync();
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>Fix scores</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body"><div class="scoreboard">${state.teams.map((t, i) => `
      <div class="score-card">
        <div class="name">${esc(t.name)}</div>
        <div class="score${t.score < 0 ? " neg" : ""}">${money(t.score)}</div>
        <div class="adj"><button class="btn big" type="button" data-adj="-100" data-i="${i}" aria-label="Take 100 from ${esc(t.name)}">-100</button><button class="btn big" type="button" data-adj="100" data-i="${i}" aria-label="Give 100 to ${esc(t.name)}">+100</button></div>
      </div>`).join("")}</div></div>`;
  ov.hidden = false;
  ov.querySelector("[data-close]").focus({ preventScroll: true });

/* ---------- Teaching list ---------- */
function drawList() {
  scheduleSync();
  Sound.stopMusic();
  const items = [];
  GAME.categories.forEach((c, ci) => c.clues.forEach((cl, ri) => {
    if (state.used[ci + "-" + ri] === "taught") items.push(lessonCard(cl, c.name + ", $" + cl.value));
  }));
  if (state.finalDone === "taught") items.push(lessonCard(GAME.final, "Final Jeopardy, " + GAME.final.category));
  const total = GAME.categories.length * 5, vals = Object.values(state.used);
  const known = vals.filter(v => v === "known").length, taught = vals.filter(v => v === "taught").length;
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>Topics to teach</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body" style="justify-content:flex-start">
      <div class="stats">
        <div class="stat k"><b>${known}</b><span>Class knew</span></div>
        <div class="stat t"><b>${taught}</b><span>Need teaching</span></div>
        <div class="stat"><b>${total - vals.length}</b><span>Not played</span></div>
      </div>
      <div class="list">${items.length ? items.join("") : `<p class="hint">Nothing yet. Any clue nobody answers shows up here with its lesson.</p>`}</div>
    </div>`;
  ov.hidden = false;
  ov.querySelector("[data-close]").focus({ preventScroll: true });
}

/* ---------- Slides: rules and presentation mode ----------
   Each slide is { head, val, html }: head and val go in the top bar, so the slide itself has no small labels. */
function rulesSlides() {
  const slides = [];
  if (state) slides.push({ head: "Rules", say: `Welcome to UX Trends Jeopardy! Tonight's teams: ${state.teams.map(t => `${t.name}, with ${t.players.join(", ")}`).join(". ")}.`, html: `<div class="slide center"><h2>Tonight's teams</h2>
    <div class="roster">${state.teams.map(t => `<div><b>${esc(t.name)}</b>${t.players.map(p => `<span>${esc(p)}</span>`).join("")}</div>`).join("")}</div></div>` });
  GAME.rules.forEach((r, i) => slides.push({ head: `Rules, ${i + 1} of ${GAME.rules.length}`, say: r.points.join(" "), html: `<div class="slide">
    <h2>${esc(r.title)}</h2><ol>${r.points.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>` }));
  return slides;
}
function lessonSlide(item, head, val) {
  return { head, val, say: `${item.note} Then ask: ${item.ask}`, html: `<div class="slide"><h2>${esc(topic(item))}</h2>
    <p class="body">${esc(item.note)}</p>
    <p class="ask">${esc(item.ask)}</p>
    <p class="src">Source: ${esc(item.source)}</p></div>` };
}
function presentSlides(onlyMissed) {
  const head = "Presentation mode";
  const pick = (ci, ri) => !onlyMissed || (state && state.used[ci + "-" + ri] === "taught");
  const slides = [{ head, say: "Let's go over what we learned today.", html: `<div class="slide center"><h2>UX Trends: What We Learned</h2>
    <p class="body">${onlyMissed ? "Only the topics nobody got." : "Every topic from the board, one at a time."}</p></div>` }];
  GAME.categories.forEach((c, ci) => {
    const clues = c.clues.map((cl, ri) => [cl, ri]).filter(([, ri]) => pick(ci, ri));
    if (!clues.length) return;
    slides.push({ head, say: `Next category: ${c.name}.`, html: `<div class="slide center"><h2>${esc(c.name)}</h2>
      <p class="body">${clues.length} topic${clues.length > 1 ? "s" : ""}</p></div>` });
    clues.forEach(([cl]) => slides.push(lessonSlide(cl, c.name, money(cl.value))));
  });
  if (!onlyMissed || (state && state.finalDone === "taught")) slides.push(lessonSlide(GAME.final, "Final Jeopardy", GAME.final.category));
  if (onlyMissed && slides.length === 1) slides.push({ head, html: `<div class="slide center"><h2>Nothing to teach yet</h2>
    <p class="body">No clue has been missed so far. Switch to all topics to see every lesson.</p></div>` });
  slides.push({ head: "Sources", say: "Here's where all of this came from.", html: `<div class="slide"><h2>Where this came from</h2><div class="sources">
    ${GAME.categories.map(c => `<h3>${esc(c.name)}</h3><ul>${c.clues.map(cl => `<li>$${cl.value}: ${esc(cl.source)}</li>`).join("")}</ul>`).join("")}
    <h3>Final Jeopardy</h3><ul><li>${esc(GAME.final.source)}</li></ul></div></div>` });
  return slides;
}
function openDeck(deck, extra = {}) { view = { kind: "deck", deck, i: 0, only: false, ...extra }; drawDeck(); }
function deckSlides() { return view.deck === "rules" ? rulesSlides() : view.deck === "cats" ? catSlides() : presentSlides(view.only); }
// Category reveal: the host introduces each category before the first clue, like the show.
function catSlides() {
  const n = GAME.categories.length;
  return GAME.categories.map((c, i) => ({
    head: `Categories, ${i + 1} of ${n}`,
    say: `${i === 0 ? "Here are today's categories. First up" : i === n - 1 ? "And our last category" : "Next"}: ${c.name}. ${c.about}`,
    html: `<div class="slide center"><h2 class="cat-reveal">${esc(c.name)}</h2><p class="body">${esc(c.about)}</p></div>`
  }));
}
function drawDeck() {
  scheduleSync();
  Sound.stopMusic();
  const slides = deckSlides(), n = slides.length;
  view.i = Math.min(Math.max(0, view.i), n - 1);
  const s = slides[view.i], last = view.i === n - 1;
  const toggle = view.deck === "present"
    ? `<button class="btn" id="deckOnly" type="button" aria-pressed="${view.only}">${view.only ? "Show all topics" : "Only missed topics"}</button>` : "";
  const nextLabel = last ? (view.start ? "Show the board" : "Done") : "Next";
  const ov = $("#overlay");
  ov.innerHTML = `<div class="ov-head"><span>${esc(s.head)}</span><span class="val">${esc(s.val || "")}</span><span class="actions">${toggle}<button class="btn" data-close type="button">Close</button></span></div>
    <div class="ov-body">${s.html}</div>
    <div class="deck-foot"><button class="btn big" id="deckPrev" type="button" ${view.i ? "" : "disabled"}>Back</button>
      <span class="pos">${view.i + 1} / ${n}</span>
      <button class="btn primary big" id="deckNext" type="button">${nextLabel}</button></div>`;
  ov.hidden = false;
  ov.scrollTop = 0;
  $("#deckNext").focus({ preventScroll: true });
}
function deckStep(d) {
  const n = deckSlides().length;
  // At the start of a game, the rules lead straight into the category reveal, then the board.
  if (d > 0 && view.i === n - 1 && view.start && view.deck === "rules") { state.intro = { filled: false, shown: 0 }; view = null; drawOverlay(); return render(); }
  if (d > 0 && view.i === n - 1) { view = null; return drawOverlay(); }
  view.i += d; drawDeck();
}

/* ---------- Final Jeopardy ----------
   Teams write bets on paper, so nobody sees them on the screen. The host types each bet in
   only when judging that team, after the answer is out. Teams at $0 or less sit it out. */
function openFinal() {
  view = { kind: "final", step: state.finalDone ? "done" : "wager", wagers: {}, judged: {}, playing: state.teams.map(t => t.score > 0) };
  drawFinal();
}
function drawFinal() {
  scheduleSync();
  Sound.stopMusic();
  const F = GAME.final, ov = $("#overlay");
  let body = "";
  if (view.step === "wager") {
    const out = state.teams.filter((_, i) => !view.playing[i]).map(t => t.name);
    body = `<div class="big-word">Final Jeopardy</div>
      <p class="clue">${esc(F.category)}</p>
      <p class="hint">Each team writes its bet on paper, from $0 up to its score, and keeps it hidden. The whole team works on this one.</p>
      ${out.length ? `<p class="hint out">${esc(out.join(" and "))} ${out.length > 1 ? "have" : "has"} no money to bet, so ${out.length > 1 ? "they sit" : "it sits"} this one out.</p>` : ""}
      <div class="actions"><button class="btn primary big" id="finalClue" type="button">Show the clue</button></div>`;
  } else if (view.step === "clue") {
    body = `<p class="clue">${esc(F.clue)}</p>
      ${timerHtml}
      ${liveOn ? `<p class="host-answer" style="margin:0 auto"><b>Answer (only on this screen)</b>${esc(F.answer)}</p>` : ""}
      <div class="actions"><button class="btn primary big" id="finalReveal" type="button">Reveal answer</button></div>`;
  } else if (view.step === "answer") {
    const done = state.teams.every((_, i) => !view.playing[i] || view.judged[i]);
    body = `<p class="answer">${esc(F.answer)}</p>
      <p class="hint host-only">Each team shows its paper. Type the bet, then mark it.</p>
      <div class="judge">${state.teams.map((t, i) => {
        const j = view.judged[i], max = Math.max(t.score, 0);
        let right;
        if (!view.playing[i]) right = `<span class="res out">Sitting out</span><span></span>`;
        else if (j) right = `<span class="res">${money(view.wagers[i])}</span><span class="res ${j}">${j === "ok" ? "Correct" : "Wrong"}</span>`;
        else right = `<span class="wager"><input id="fw-${i}" type="number" inputmode="numeric" min="0" max="${max}" step="100" placeholder="0" aria-label="${esc(t.name)} bet, up to ${money(max)}"></span>
          <span class="actions"><button class="btn right big" data-fjudge="ok" data-i="${i}" type="button">Correct</button>
          <button class="btn wrong big" data-fjudge="no" data-i="${i}" type="button">Wrong</button></span>`;
        return `<div class="judge-row"><span class="t">${esc(t.name)}</span>${right}</div>`;
      }).join("")}</div>
      <div class="actions"><button class="btn primary big" id="finalDone" type="button" ${done ? "" : "disabled"}>See results</button></div>`;
  } else {
    const ranked = [...state.teams].sort((a, b) => b.score - a.score);
    const winners = ranked.filter(t => t.score === ranked[0].score).map(t => t.name);
    const headline = winners.length === 1 ? `${winners[0]} wins!` : winners.length === 2 ? `${winners[0]} and ${winners[1]} tie!` : "Three-way tie!";
    body = `<div class="big-word">${esc(headline)}</div>
      <div class="ranking">${ranked.map(t => `<div><span>${esc(t.name)}</span><b>${money(t.score)}</b></div>`).join("")}</div>
      ${state.finalDone === "known" ? "" : lessonCard(F)}
      <div class="actions"><button class="btn primary big" id="openList" type="button">See all topics to teach</button>
        <button class="btn big" id="openPresent" type="button">Presentation mode</button></div>`;
  }
  ov.innerHTML = `<div class="ov-head"><span>Final Jeopardy</span><span class="val">${view.step === "done" ? "" : esc(F.category)}</span><button class="btn" data-close type="button">Close</button></div>
    <div class="ov-body">${body}</div>`;
  ov.hidden = false;
  (ov.querySelector(".ov-body input, .ov-body .btn.primary:not(:disabled), .ov-body .btn:not(:disabled)") || ov).focus({ preventScroll: true });
}

/* ---------- Events ---------- */
$("#setupForm").addEventListener("submit", e => {
  e.preventDefault();
  const teams = [...Array(TEAM_COUNT)].map((_, i) => ({
    name: $("#name-" + i).value.trim() || "Team " + (i + 1),
    players: [...Array(TEAM_SIZE)].map((_, j) => $(`#p-${i}-${j}`).value.trim() || `Player ${j + 1}`)
  }));
  state = newState(teams); showGame();
  Sound.prime();
  openDeck("rules", { start: true });
});

// Close the host tab once the mouse is anywhere outside it. (A mouseout isn't reliable here:
// the tab is redrawn under the mouse after every click.)
document.addEventListener("mousemove", e => {
  if (hostOpen && !e.target.closest(".host")) { hostOpen = false; document.querySelectorAll(".host.open").forEach(x => x.classList.remove("open")); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (LIVE) { if (t.id === "liveFull") document.documentElement.requestFullscreen?.().catch(() => {}); return; }
  if (t.hasAttribute("data-open-live")) return openLive();
  if (t.dataset.sfx) { Sound.prime(); return Sound[t.dataset.sfx](); }
  if (t.dataset.cell) return selectTile(t);
  if (t.dataset.go) return $("#" + t.dataset.go).click();
  if (t.hasAttribute("data-newgame")) { if (confirm("End this game and start a new one?")) showSetup(); return; }
  if (t.id === "dashMusic") { if (Sound.playing) Sound.stopMusic(); else { Sound.prime(); Sound.startMusic(30); } return updateDash(); }
  if (t.id === "dashSound") { const on = Sound.toggle(); setLabel("#btnSound", on ? "Sound on" : "Sound off"); return updateDash(); }
  if (t.id === "dashPickMusic") return $("#musicFile").click();
  hostOpen = !!t.closest(".host-panel");
  if (t.id === "resume") { state = loadSaved(); return showGame(); }
  if (t.id === "menuBtn") return toggleMenu();
  if (t.closest("#menuList") && t.id !== "btnReset" && t.id !== "btnSound") toggleMenu(false);
  if (t.classList.contains("tile")) return selectTile(t);
  if (t.dataset.adj) { state.teams[t.dataset.i].score += Number(t.dataset.adj); return render(); }
  if (t.hasAttribute("data-close")) {
    // A team already missed: closing now counts as "nobody got it".
    if (view && !view.kind && (view.step === "clue" || view.step === "answer") && view.out.length) finishClue("taught");
    view = null; drawOverlay();
    return state && render();             // clears a tile left lit by a Daily Double that wasn't played
  }
  if (t.id === "btnScores") { view = { kind: "scores" }; return drawScores(); }
  if (t.id === "btnList" || t.id === "openList") { view = { kind: "list" }; return drawList(); }
  if (t.id === "btnRules") return openDeck("rules");
  if (t.id === "btnCats") { state.intro = { filled: true, shown: 0 }; view = null; drawOverlay(); return render(); }
  if (t.hasAttribute("data-intro")) return introStep();
  if (t.id === "btnPresent" || t.id === "openPresent") return openDeck("present");
  if (t.id === "deckPrev") return deckStep(-1);
  if (t.id === "deckNext") return deckStep(1);
  if (t.id === "deckOnly") { view.only = !view.only; view.i = 0; return drawDeck(); }
  if (t.id === "btnPickMusic") return $("#musicFile").click();
  if (t.id === "btnClearMusic") return Sound.setMusic(null);
  if (t.id === "btnMusic") {
    if (Sound.playing) return Sound.stopMusic();
    Sound.prime(); return Sound.startMusic(30);
  }
  if (t.id === "btnFinal" || t.hasAttribute("data-final")) return openFinal();
  if (t.id === "btnReset") {
    if (t.dataset.armed) { toggleMenu(false); return showSetup(); }
    t.dataset.armed = "1"; setLabel("#btnReset", "Click again to end this game");
    setTimeout(() => { delete t.dataset.armed; setLabel("#btnReset", "New game"); }, 3500);
    return;
  }

  // Clue flow
  if (t.id === "ddGo") {
    const max = Math.max(state.teams[view.team].score, 500);
    const w = Number($("#ddWager").value) || clueById(view.id).clue.value;
    view.wager = Math.min(Math.max(5, Math.round(w)), max);
    view.step = "clue"; drawOverlay(); return runTimer(30);
  }
  if (t.id === "btnFull") {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen?.();
    else el.requestFullscreen?.().catch(() => {});
    return;
  }
  if (t.id === "btnSound") { const on = Sound.toggle(); setLabel("#btnSound", on ? "Sound on" : "Sound off"); t.setAttribute("aria-pressed", on); return; }
  if (t.id === "reveal") { view.step = "answer"; return drawOverlay(); }
  if (t.dataset.pick) { view.team = Number(t.dataset.pick); return drawOverlay(); }
  // Grab the winner's name before finishClue rotates players.
  const win = i => { view.winner = i; view.winnerName = playerUp(i); };
  if (t.dataset.judge) {
    const amount = view.wager ?? clueById(view.id).clue.value;
    if (t.dataset.judge === "right") {
      Sound.right(); state.teams[view.team].score += amount; win(view.team);
      finishClue("known", view.team); view.step = "known"; return drawOverlay();
    }
    Sound.wrong();
    if (view.wager != null) {                      // Daily Double: the wager is lost
      state.teams[view.team].score -= amount;
      finishClue("taught"); view.step = "teach"; return drawOverlay();
    }
    view.out.push(view.team); view.team = null;
    if (!remaining().length) { finishClue("taught"); view.step = "teach"; return drawOverlay(); }
    return drawOverlay();
  }
  if (t.dataset.award) {
    const i = Number(t.dataset.award), amount = view.wager ?? clueById(view.id).clue.value;
    Sound.right(); state.teams[i].score += amount; win(i);
    finishClue("known", i); view.step = "known"; return drawOverlay();
  }
  if (t.id === "nobody") {
    Sound.wrong();
    if (view.wager != null) state.teams[view.team].score -= view.wager;
    finishClue("taught"); view.step = "teach"; return drawOverlay();
  }
  if (t.id === "teachAnyway") { view.step = "review"; return drawOverlay(); }

  // Final flow
  if (t.id === "finalClue") { view.step = "clue"; drawFinal(); return runTimer(30); }
  if (t.id === "finalReveal") { view.step = "answer"; return drawFinal(); }
  if (t.dataset.fjudge) {
    const i = Number(t.dataset.i), max = Math.max(state.teams[i].score, 0);
    const w = Math.min(Math.max(0, Math.round(Number($("#fw-" + i).value) || 0)), max);
    view.wagers[i] = w; view.judged[i] = t.dataset.fjudge;
    t.dataset.fjudge === "ok" ? Sound.right() : Sound.wrong();
    state.teams[i].score += t.dataset.fjudge === "ok" ? w : -w;
    render(); return drawFinal();
  }
  if (t.id === "finalDone") {
    state.finalDone = Object.values(view.judged).includes("ok") ? "known" : "taught";
    render(); view.step = "done"; drawFinal(); return Sound.win();
  }
});

// Host shortcuts, for when the menu is out of reach: P, T, R, F, S, M.
const SHORTCUTS = { c: "#btnCats", p: "#btnPresent", t: "#btnList", r: "#btnRules", f: "#btnFinal", s: "#btnScores", m: "#btnMusic" };
document.addEventListener("keydown", e => {
  if (LIVE) return;
  if (e.key === "Escape" && !$("#menuList").hidden) return toggleMenu(false);
  if (e.key === "Escape" && view) return document.querySelector("#overlay [data-close]")?.click();
  if (e.target.closest("input")) return;
  // Buzzers: press 1, 2 or 3 for the team whose player buzzed in (or, after the answer, who got it).
  if (view && !view.kind && /^[1-9]$/.test(e.key)) {
    const i = Number(e.key) - 1;
    if (view.step === "clue" && view.team == null) return document.querySelector(`#overlay [data-pick="${i}"]`)?.click();
    if (view.step === "answer") return document.querySelector(`#overlay [data-award="${i}"]`)?.click();
  }
  // Slide clickers send PageDown / PageUp; arrow keys work too. They also step the board intro.
  if (!view && state && state.intro && ["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); return introStep(); }
  if (view && view.kind === "deck") {
    if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); return deckStep(1); }
    if (["ArrowLeft", "PageUp"].includes(e.key) && view.i > 0) { e.preventDefault(); return deckStep(-1); }
  }
  // Shortcuts never interrupt a clue that is in play.
  const key = e.key.toLowerCase(), sel = SHORTCUTS[key];
  if (sel && !e.ctrlKey && !e.metaKey && !e.altKey && state && !$("#game").hidden && (!view || view.kind)) {
    e.preventDefault(); $(sel).click();
  }
});

$("#musicFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) Sound.setMusic(f);
  e.target.value = "";
});

/* ---------- Boot ---------- */
buildSetup();
if (LIVE) startLive();
else {
  startControl();
  window.claude?.hot?.snapshot?.(() => state ? { state, view } : {});
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
function start(data) {
  if (data && data.state) { state = data.state; view = data.view || null; showGame(); drawOverlay(); }
  else showSetup();
}
</script>
</body>
</html>
