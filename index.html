<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UX Trends Jeopardy</title>
<style>
/* Fonts live in /fonts so the game looks right offline or on a school network that blocks Google. */
@font-face { font-family: "Anton"; font-weight: 400; font-display: swap; src: url(fonts/Anton-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(fonts/BarlowCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(fonts/BarlowCondensed-700.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 500; font-display: swap; src: url(fonts/Spectral-500.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 500; font-style: italic; font-display: swap; src: url(fonts/Spectral-500i.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 700; font-display: swap; src: url(fonts/Spectral-700.woff2) format("woff2"); }

/* Layout: game-show stage. Setup screen -> rules slides -> board with podiums -> full-screen clue.
   Missed clues open a lesson. Presentation mode walks through every lesson slide by slide.
   Gold is only for money and the main button. Anton for anything on the "TV",
   Spectral for reading, Barlow Condensed for controls. */
:root {
  color-scheme: dark;
  --night: #04050f;
  --gold: #eba43f;
  --ink: #ffffff;
  --ink-soft: #c3ccf7;
  --right: #3ddc97;
  --wrong: #ff8a8a;
  --tile-top: #1528c6;
  --tile-bottom: #0a17a4;
  --bezel: #03051a;
  --rim: #19226b;
  --lamp: #ffc861;
  --podium: #070b2c;
  --wood-top: #5b4127;
  --wood-bottom: #2a1d10;
  --wood-ink: #f1d7a8;
  --font-board: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-clue: "Spectral", Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 600 17px/1.4 var(--font-ui);
  background: radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%) fixed var(--night);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.btn {
  border: 2px solid #000; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border-radius: 2px;
  padding: 8px 16px; font: 700 16px/1.1 var(--font-ui); text-transform: uppercase; letter-spacing: .05em;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn.primary { background: var(--gold); color: #000; }
.btn.big { padding: 12px 22px; font-size: 20px; }
.btn.right { background: #0d6b45; }
/* Live screen (projector): everything the host clicks is hidden; it only mirrors the control board. */
body.live .menu, body.live .host, body.live .btn, body.live input, body.live .wager label { display: none !important; }
body.live { cursor: none; }
body.live .ov-head { position: relative; min-height: 38px; }
body.live .ov-head .val { position: absolute; left: 50%; transform: translateX(-50%); }
.live-full.idle { opacity: 0; pointer-events: none; }
.live-full {
  position: fixed; z-index: 20; bottom: 16px; right: 16px; transition: opacity .3s; cursor: pointer; border: 2px solid #000; padding: 10px 18px;
  background: var(--gold); color: #000; font: 700 18px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .05em;
}
.live-badge {
  position: fixed; z-index: 20; left: 10px; bottom: 10px; padding: 4px 10px; border: 1px solid #000;
  background: #0d6b45; font: 700 13px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .06em;
}
.host-answer { margin: 0 0 4px; padding: 6px 8px; background: rgba(0, 0, 0, .35); font: 600 16px/1.3 var(--font-clue); max-width: 320px; white-space: normal; }
.host-answer b { display: block; font: 700 12px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.host { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 2; }
.host-tab {
  opacity: .5; border: 1px solid var(--rim); background: var(--bezel); padding: 6px 12px;
  font: 700 14px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); transition: opacity .15s;
}
.host-panel {
  display: none; position: absolute; right: 0; bottom: 100%; flex-direction: column; align-items: stretch; gap: 6px;
  min-width: 240px; padding: 8px; margin-bottom: 6px; background: var(--podium); border: 2px solid #000; box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
}
.host:hover .host-tab, .host:focus-within .host-tab { opacity: 1; }
.host:hover .host-panel, .host:focus-within .host-panel, .host.open .host-panel { display: flex; }
.host-panel .btn { text-align: left; white-space: nowrap; }
/* Invisible bridge so the panel doesn't close while the mouse moves up from the tab. */
.host-panel::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; }
.btn kbd { display: inline-block; min-width: 1.4em; margin-right: 6px; padding: 0 4px; border: 1px solid rgba(255, 255, 255, .5); font: inherit; font-size: .8em; }
.btn.wrong { background: #8a1f2b; }
.title { margin: 0; font: 400 clamp(36px, 6vw, 72px)/1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; text-shadow: 4px 4px 0 #000; }

/* Setup */
.setup { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 32px; }
.setup-card { width: 100%; max-width: 1000px; display: grid; gap: 22px; text-align: center; }
.setup-card > p { margin: 0; font: 500 clamp(17px, 1.8vw, 21px)/1.4 var(--font-clue); color: var(--ink-soft); }
.team-setup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; text-align: left; }
.team-setup fieldset {
  margin: 0; border: 3px solid #000; padding: 14px; display: grid; gap: 8px;
  background: linear-gradient(var(--wood-top), var(--wood-bottom));
}
.team-setup input, .field input {
  width: 100%; background: rgba(0, 0, 20, .55); border: 1px solid #000; border-radius: 0; padding: 8px 10px; font: 600 18px/1.2 var(--font-ui);
}
.team-setup input.team-name {
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000; margin-bottom: 4px;
  font: 400 24px/1.2 var(--font-board); text-transform: uppercase; letter-spacing: .03em; text-align: center;
}
.team-setup input::placeholder { color: rgba(255, 255, 255, .45); }
.setup-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 760px) { .team-setup { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; }
.field label { font: 700 16px/1.2 var(--font-ui); color: var(--ink-soft); }

/* Game: the TV set. Bronze top band with a row of lights, orange ladder pillars edged in blue,
   a charcoal frame around a flat blue board split by black lines, a blue neon floor. */
.app {
  height: 100%; min-height: 540px; display: flex; flex-direction: column; gap: 8px;
  padding-inline: 16px; padding-block: 10px;
  background:
    radial-gradient(circle at 96% 62%, rgba(150, 60, 210, .35), transparent 28%),
    radial-gradient(ellipse 75% 65% at 50% 42%, #11164c, #04050f 78%);
}
.stage {
  flex: 1; min-height: 0; width: 100%; max-width: 1500px; margin: 0 auto;
  display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px; grid-template-rows: 40px 1fr 20px; column-gap: 18px;
}
.lamps {
  grid-column: 1 / -1; position: relative; border-radius: 10px 10px 0 0;
  background: linear-gradient(#2c1e12, #70502e 45%, #3a2817 80%, #1a120b);
  box-shadow: 0 2px 0 #000;
}
.lamps::before {
  content: ""; position: absolute; left: 2%; right: 2%; top: 7px; height: 3px; border-radius: 2px;
  background: var(--lamp); box-shadow: 0 0 6px var(--lamp), 0 8px 0 #c98d3f, 0 8px 6px rgba(255, 190, 90, .6);
}
.lamps::after {
  content: ""; position: absolute; left: 3%; right: 3%; bottom: 5px; height: 9px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #cfe8ff 0 52px, #1d2846 52px 58px);
  box-shadow: 0 0 10px rgba(160, 210, 255, .8);
}
.pillar {
  grid-row: 2; display: grid; grid-template-rows: repeat(10, 1fr); padding: 10px 12px; margin-block: 8px;
  background: #0a0e2c; border: 4px solid #5aa8ff; border-radius: 3px;
  box-shadow: 0 0 12px rgba(90, 168, 255, .9), 0 0 30px rgba(60, 120, 255, .45), inset 0 0 10px rgba(90, 168, 255, .55);
}
.pillar i {
  margin-inline: -22px;
  background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat;
}
.pillar i:last-child { background:
    linear-gradient(#a3a5ad, #6a6d75) top / 100% 5px no-repeat,
    linear-gradient(#a3a5ad, #6a6d75) bottom / 100% 5px no-repeat,
    linear-gradient(90deg, #b0501a, #f59b3e 50%, #b0501a) center / calc(100% - 46px) 100% no-repeat; }
.bezel {
  grid-row: 2; grid-column: 2; display: flex; padding: 12px; border-radius: 12px; overflow-x: auto;
  background: linear-gradient(#24252c, #141519); box-shadow: inset 0 0 0 2px #31333c, 0 0 0 2px #050507;
}
.board {
  flex: 1; min-width: 720px; display: grid; grid-template-columns: repeat(6, 1fr);
  grid-template-rows: 1fr repeat(5, 1fr); gap: 6px; padding: 6px; background: #000;
}
.floor {
  grid-column: 1 / -1; grid-row: 3; align-self: end; height: 12px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, #3a74ff 0 140px, #0d1a55 140px 144px);
  box-shadow: 0 0 22px 4px rgba(40, 100, 255, .6);
}
.cat, .tile {
  border: 0; border-radius: 0; min-height: 40px;
  background: linear-gradient(var(--tile-top), var(--tile-bottom));
  box-shadow: inset 0 0 18px rgba(0, 0, 50, .45);
  display: grid; place-items: center; text-align: center; padding: 4px 8px;
}
.cat {
  color: #fff; font: 400 clamp(16px, 1.9vw, 28px)/1.05 var(--font-board); letter-spacing: .02em;
  text-transform: uppercase; text-wrap: balance; text-shadow: 2px 2px 0 #000;
}
.tile {
  color: var(--gold); font: 400 clamp(26px, 3.6vw, 58px)/1 var(--font-board); letter-spacing: .05em;
  text-shadow: 3px 3px 0 #000, 4px 4px 3px rgba(0,0,0,.5); font-variant-numeric: tabular-nums;
  transition: filter .15s;
}
.tile:hover { filter: brightness(1.2); }
.tile.used { color: transparent; text-shadow: none; }
.tile.used:hover { filter: brightness(1.08); }
.tile.selected {
  position: relative; z-index: 1; filter: brightness(1.35);
  box-shadow: 0 0 0 2px #e6eeff, 0 0 26px 6px rgba(140, 180, 255, .85);
}
/* While the clue card grows out of its square, only the clue rides along. */
.overlay.zooming { transform-origin: 0 0; }
.overlay.zooming::before, .overlay.zooming .ov-head, .overlay.zooming .ov-body > :not(.clue):not(.big-word) { opacity: 0; }
.overlay::before, .ov-head, .ov-body > * { transition: opacity .25s; }

/* Podiums, like the show: score on top, then who is standing there. */
.turn-line { margin: 0; text-align: center; font: 400 clamp(17px, 1.8vw, 24px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .04em; }
.podiums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 1100px; margin: 0 auto; }
.podium {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px;
  padding: 6px 10px; border: 3px solid #000; background: linear-gradient(var(--wood-top), var(--wood-bottom)); min-width: 0;
}
.podium .p-score {
  grid-row: span 2; min-width: 4.2em; padding: 4px 8px; text-align: center;
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000;
  font: 400 clamp(24px, 2.8vw, 40px)/1.1 var(--font-board); text-shadow: 2px 2px 0 #000; font-variant-numeric: tabular-nums;
}
.podium .p-score.neg { color: var(--wrong); }
.podium .p-team { font: 400 clamp(16px, 1.6vw, 22px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.podium .p-player { font: 600 clamp(14px, 1.3vw, 18px)/1.1 var(--font-ui); color: var(--wood-ink); overflow-wrap: anywhere; }
.podium.up { box-shadow: 0 0 0 3px #fff, 0 0 20px rgba(160, 200, 255, .6); }
@media (max-width: 700px) {
  .podium { grid-template-columns: 1fr; text-align: center; }
  .podium .p-score { grid-row: auto; min-width: 0; }
}

.scoreboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 960px; }
.score-card { background: linear-gradient(var(--wood-top), var(--wood-bottom)); border: 3px solid #000; padding: 18px 14px; display: grid; gap: 12px; min-width: 0; }
.score-card .name { font: 400 clamp(20px, 2.4vw, 30px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
.score-card .score { font: 400 clamp(40px, 6vw, 76px)/1 var(--font-board); text-shadow: 3px 3px 0 #000; font-variant-numeric: tabular-nums; background: linear-gradient(var(--tile-top), var(--tile-bottom)); border: 2px solid #000; padding: 8px 4px; }
.score-card .score.neg { color: var(--wrong); }
.score-card .adj { display: flex; justify-content: center; gap: 10px; }
.score-card .adj .btn { min-width: 84px; font-size: 20px; }
@media (max-width: 700px) { .scoreboard { grid-template-columns: 1fr; } }

.menu { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 6px); right: 8px; }
.menu-btn {
  opacity: .55; border: 1px solid var(--rim); background: var(--bezel); border-radius: 2px; padding: 7px 10px;
  display: grid; gap: 4px; transition: opacity .15s;
}
.menu-btn span { display: block; width: 18px; height: 2px; background: var(--ink-soft); }
.menu-btn:hover, .menu-btn:focus-visible, .menu.open .menu-btn { opacity: 1; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 260px; display: grid; padding: 4px;
  background: var(--podium); border: 2px solid #000; box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
}
.menu-list button {
  display: flex; align-items: center; gap: 8px; text-align: left; background: transparent; border: 0; padding: 9px 12px;
  font: 700 17px/1.1 var(--font-ui); text-transform: uppercase; letter-spacing: .04em;
}
.menu-list button:hover { background: var(--tile-bottom); }
.menu-list kbd {
  margin-left: auto; min-width: 1.6em; padding: 1px 5px; border: 1px solid var(--rim); text-align: center;
  font: 700 13px/1.4 var(--font-ui); color: var(--ink-soft);
}
.menu-list hr { border: 0; border-top: 1px solid var(--rim); margin: 4px 0; width: 100%; }
.count {
  display: inline-block; min-width: 1.5em; padding: 0 6px;
  background: var(--wrong); color: #000; font-size: 14px; font-weight: 700;
  text-align: center; font-variant-numeric: tabular-nums;
}
.count[data-n="0"] { background: var(--rim); color: var(--ink-soft); }

@media (max-width: 700px) {
  .app { height: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: 30px auto 24px; }
  .pillar { display: none; }
  .bezel { grid-column: 1; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .podiums { gap: 8px; }
}

/* Overlay. Keeps the set's light strip along the top so every screen still feels like the show. */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: linear-gradient(var(--tile-top), var(--tile-bottom)); display: flex; flex-direction: column; overflow-y: auto;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  animation: open .2s ease-out;
}
.overlay::before {
  content: ""; flex: 0 0 30px; margin: 0 -16px 12px;
  background:
    repeating-linear-gradient(90deg, #cfe8ff 0 52px, #1d2846 52px 58px) center bottom 6px / 94% 8px no-repeat,
    linear-gradient(var(--lamp), var(--lamp)) center top 6px / 96% 3px no-repeat,
    linear-gradient(#2c1e12, #70502e 45%, #3a2817 80%, #1a120b);
  box-shadow: 0 2px 0 #000;
}
@keyframes open { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .overlay { animation: none; } .tile, .menu-btn { transition: none; } }
.ov-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  font: 400 clamp(18px, 2vw, 26px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .04em; text-shadow: 2px 2px 0 #000;
}
.ov-head .val { color: var(--gold); font-variant-numeric: tabular-nums; }
.ov-body {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding-block: 20px; max-width: 1100px; width: 100%; margin: 0 auto; text-align: center;
}
.who { margin: 0; font: 400 clamp(26px, 3vw, 40px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .03em; text-shadow: 3px 3px 0 #000; }
.who small { display: block; margin-top: 6px; font: 600 clamp(16px, 1.6vw, 20px)/1 var(--font-ui); letter-spacing: .02em; text-transform: none; color: var(--ink-soft); text-shadow: none; }
.clue { margin: 0; font: 700 clamp(26px, 3.6vw, 48px)/1.25 var(--font-clue); text-transform: uppercase; text-shadow: 2px 3px 0 #000; text-wrap: balance; }
.clue.small { font-size: clamp(15px, 1.6vw, 20px); text-shadow: none; color: var(--ink-soft); max-width: 60ch; }
.answer { font: 700 clamp(26px, 3.2vw, 40px)/1.3 var(--font-clue); text-wrap: balance; margin: 0; text-shadow: 2px 2px 0 #000; }
.big-word { font: 400 clamp(56px, 10vw, 128px)/.95 var(--font-board); text-transform: uppercase; text-shadow: 5px 5px 0 #000; text-wrap: balance; }
.hint { color: var(--ink-soft); font: 500 clamp(16px, 1.6vw, 20px)/1.45 var(--font-clue); margin: 0; max-width: 60ch; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.status { font: 700 clamp(19px, 1.9vw, 24px)/1.3 var(--font-ui); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.status.known { color: var(--right); }
.status.taught { color: var(--wrong); }
.inline { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 720px; }

/* Wager box: small, centered, money-sized digits. */
.wager { display: grid; justify-items: center; gap: 6px; }
.wager input {
  width: 6.5ch; padding: 4px 10px; text-align: center; background: rgba(0, 0, 20, .55); border: 3px solid #000;
  font: 400 clamp(40px, 5vw, 64px)/1.1 var(--font-board); color: var(--gold); font-variant-numeric: tabular-nums;
}
.wager label { font: 600 18px/1.2 var(--font-ui); color: var(--ink-soft); }

/* Lesson: plain text on the blue, no box. */
.lesson { text-align: left; width: 100%; max-width: 66ch; display: grid; gap: 12px; }
.lesson h2 { margin: 0; font: 400 clamp(30px, 3.4vw, 44px)/1.1 var(--font-board); text-transform: uppercase; letter-spacing: .02em; text-shadow: 3px 3px 0 #000; text-wrap: balance; }
.lesson .where { margin: -6px 0 0; font: 600 17px/1.3 var(--font-ui); color: var(--ink-soft); }
.lesson p { margin: 0; font: 500 19px/1.55 var(--font-clue); }
.lesson .ask { font-style: italic; }
.lesson .ask b { font-style: normal; }
.lesson .src { font: 500 15px/1.45 var(--font-clue); color: var(--ink-soft); }

.timer { width: 100%; max-width: 640px; display: grid; gap: 6px; }
.timer .track { height: 12px; background: #000; border: 2px solid #000; overflow: hidden; }
.timer .fill { height: 100%; background: #fff; transform-origin: left; animation: drain 30s linear forwards; }
.timer .left { font: 400 28px/1 var(--font-board); font-variant-numeric: tabular-nums; text-shadow: 2px 2px 0 #000; }
.timer.done .left { color: var(--wrong); }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.out { color: var(--wrong); }
.list { display: grid; gap: 40px; width: 100%; justify-items: center; }
.list .lesson + .lesson { border-top: 2px solid rgba(0, 0, 0, .5); padding-top: 32px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stat { background: rgba(0, 0, 25, .5); border: 3px solid #000; padding: 10px 16px; min-width: 120px; }
.stat b { display: block; font: 400 34px/1 var(--font-board); font-variant-numeric: tabular-nums; }
.stat.k b { color: var(--right); } .stat.t b { color: var(--wrong); }
.stat span { font: 700 16px/1.2 var(--font-ui); color: var(--ink-soft); }

/* Final Jeopardy judging */
.judge { display: grid; gap: 12px; width: 100%; max-width: 820px; }
.judge-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px;
  padding: 10px 14px; background: rgba(0, 0, 25, .45); border: 3px solid #000; text-align: left;
}
.judge-row .t { font: 400 clamp(20px, 2.2vw, 28px)/1.1 var(--font-board); text-transform: uppercase; overflow-wrap: anywhere; }
.judge-row .wager input { font-size: 30px; width: 5.5ch; padding: 2px 6px; }
.judge-row .res { font: 400 24px/1 var(--font-board); text-transform: uppercase; }
.judge-row .res.ok { color: var(--right); } .judge-row .res.no { color: var(--wrong); } .judge-row .res.out { color: var(--ink-soft); }
@media (max-width: 700px) { .judge-row { grid-template-columns: 1fr; text-align: center; } }

/* Results */
.ranking { display: grid; gap: 10px; width: 100%; max-width: 640px; }
.ranking div {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 18px;
  background: linear-gradient(var(--wood-top), var(--wood-bottom)); border: 3px solid #000;
  font: 400 clamp(22px, 2.6vw, 34px)/1.1 var(--font-board); text-transform: uppercase;
}
.ranking div:first-child { box-shadow: 0 0 0 3px #fff; }
.ranking b { font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; }

.deck-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.deck-foot .pos { font: 400 20px/1 var(--font-board); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.slide { width: 100%; max-width: 1100px; display: grid; gap: 24px; text-align: left; }
.slide.center { text-align: center; justify-items: center; }
.slide h2 { margin: 0; font: 400 clamp(40px, 5.5vw, 80px)/1.02 var(--font-board); text-transform: uppercase; letter-spacing: .02em; text-shadow: 4px 4px 0 #000; text-wrap: balance; }
.slide .body { margin: 0; font: 500 clamp(21px, 2.3vw, 31px)/1.5 var(--font-clue); max-width: 60ch; text-shadow: 1px 2px 0 rgba(0,0,0,.6); }
.slide .ask { margin: 0; font: italic 500 clamp(21px, 2.3vw, 31px)/1.45 var(--font-clue); max-width: 60ch; padding-top: 18px; border-top: 2px solid rgba(0, 0, 0, .5); }
.slide .ask b { font-style: normal; font-weight: 700; }
.slide .src { margin: 0; font: 500 clamp(14px, 1.3vw, 17px)/1.45 var(--font-clue); color: var(--ink-soft); }
.slide ol { margin: 0; padding-left: 1.3em; display: grid; gap: 14px; font: 500 clamp(21px, 2.3vw, 31px)/1.4 var(--font-clue); max-width: 60ch; }
.slide li::marker { font-family: var(--font-board); }
.slide .roster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; text-align: center; }
.slide .roster div { background: linear-gradient(var(--wood-top), var(--wood-bottom)); border: 3px solid #000; padding: 14px; }
.slide .roster b { display: block; font: 400 clamp(22px, 2.6vw, 34px)/1.1 var(--font-board); text-transform: uppercase; text-shadow: 2px 2px 0 #000; margin-bottom: 8px; }
.slide .roster span { display: block; font: 600 clamp(18px, 1.8vw, 24px)/1.4 var(--font-ui); color: var(--wood-ink); }
.slide .sources { columns: 2 380px; column-gap: 32px; font: 500 16px/1.45 var(--font-clue); }
.slide .sources h3 { margin: 0 0 4px; font: 400 20px/1.1 var(--font-board); text-transform: uppercase; break-after: avoid; }

<script>
/* =====================================================================
   GAME CONTENT. Edit anything in GAME to change the questions.
   Each clue has: value, clue (read aloud), answer, note (what you say
   if nobody gets it), ask (a question for the class) and source.
   Questions written by the class team (Chris, Braydon, Joaquin).
   "Class reading" = the UX trends paper we read. Put its full title
   in READING below and it shows up everywhere.
   ===================================================================== */
const READING = "Class reading: UX trends paper";
const GAME = {
  rules: [
    { title: "How it works", points: [
      "Three teams of four.",
      "Each team sends one player up to the podium at a time.",
      "After every clue, the next player on each team comes up. Everyone plays.",

    ]},
    { title: "Wrong answers", points: [
      "Miss it, and the other players can buzz in.",

    ]},
    { title: "Daily Double and Final", points: [
      "One clue on the board is a Daily Double. The player up bets $5 up to their team's score (or $500), and answers alone.",
      "Final Jeopardy comes at the end. Each team writes a secret bet on paper, and the whole team works on the answer together. Teams with $0 or less sit it out.",
      "Most money at the end wins."
    ]}
  ],
  categories: [
    { name: "UX-cellent", clues: [
      { value: 100, clue: "This 2026 accessibility approach swaps pass/fail checklists for settings users control themselves, like text size, contrast and motion.",
        answer: "What is Comfort Mode?",
        note: "Instead of checking boxes on an audit, the app hands the settings to the user. Bigger text, more contrast, less motion, and it remembers what you picked. Your phone already does a version of this in Settings > Accessibility. The paper we read says accessibility is a requirement now, and in Europe it's the law.",
        ask: "Which of those settings would you actually turn on?",
        source: READING + "; European Accessibility Act, Directive (EU) 2019/882, in force June 2025." },
      { value: 200, clue: "Instead of displaying endless chart walls, 2026 dashboard UX focuses on highlighting what primary element first?",
        answer: "What are key decisions and actionable next steps?",
        note: "Nobody wants to stare at twelve charts to figure out what's wrong. A good dashboard just tells you: \"3 orders are late, call these customers.\" The charts are still there if you want to dig in.",
        ask: "What app shows you way too much data?",
        source: READING + "." },
      { value: 300, clue: "When prototyping unpredictable AI features where outputs change every time, what non-linear flow model do designers use?",
        answer: "What are probabilistic user flows?",
        note: "Normal flows are a straight line. Tap this, see that. AI can give a different answer every time, so you have to plan for the good answer, the half-right answer, the wrong one, and \"I don't know.\"",
        ask: "What should an AI app do when it isn't sure?",
        source: READING + "." },
      { value: 400, clue: "In virtual reality environments, what eye-tracking metric allows adaptive screens to automatically simplify content when a user gets mentally overwhelmed?",
        answer: "What is pupil dilation?",
        note: "Your pupils get bigger when your brain is working hard. Some VR headsets track your eyes, so they can notice when you're overloaded and cut back what's on screen. Cool, but that's very personal data to hand over.",
        ask: "Would you let an app watch your eyes?",
        source: READING + "; Kahneman & Beatty, \"Pupil Diameter and Load on Memory,\" Science, 1966." },
      { value: 500, clue: "Instead of complex textbook math formulas, what operational metric do working designers track to prove financial ROI to executives?",
        answer: "What is customer support ticket volume (or development rework and complaints)?",
        note: "Bosses care about money. If a redesign means way fewer people emailing support with \"I can't log in,\" that's money saved, and it's easy to show on one slide.",
        ask: "What else could prove a redesign worked?",
        source: READING + "." }
    ]},
    { name: "Pixel Perfect", clues: [
      { value: 100, clue: "Name the design language developed by Apple as a unified visual theme for the graphical user interfaces of its suite of operating systems.",
        answer: "What is Liquid Glass?",
        note: "Apple's 2025 redesign across iPhone, iPad, Mac, Watch and TV. Buttons and tab bars look like see-through glass. A lot of people said it was hard to read, so Apple added a setting to make it more solid.",
        ask: "Is see-through glass a good idea for buttons?",
        source: "Apple Newsroom, \"Apple introduces a delightful and elegant new software design,\" June 9, 2025." },
      { value: 200, clue: "What is the layout style that organizes information into a grid of clean, asymmetrical compartments of varying sizes, inspired by traditional Japanese lunchboxes?",
        answer: "What is a bento box (bento grid)?",
        note: "Content goes in boxes of different sizes, like a bento lunch. The big box is the important one. Apple uses it all over their product pages.",
        ask: "Find a bento grid on a website you use.",
        source: READING + "; apple.com product pages." },
      { value: 300, clue: "This kind of interface lets you use two or more ways of talking to a device, like voice, touch and gestures.",
        answer: "What is a multimodal interface?",
        note: "More than one way to talk to a device: touch, voice, gestures, typing. You ask your phone a question out loud, then tap the answer. It also helps people who can't use one of those inputs.",
        ask: "When would you rather talk than tap?",
        source: READING + "." },
      { value: 400, clue: "This image effect softens a picture by blending each pixel with its neighbors using a bell-shaped curve.",
        answer: "What is a Gaussian blur?",
        note: "It averages each pixel with its neighbors so the image goes soft. Designers use it for the frosted-glass look, like the background behind your phone's Control Center, so text stays readable on top of a busy picture.",
        ask: "Where have you seen a blurred background behind text?",
        source: "MDN Web Docs, \"blur() CSS function\" (developer.mozilla.org)." },
      { value: 500, clue: "What CSS function restricts a value to a fluid range between a minimum and a maximum, so fonts, padding and widths scale responsively with the viewport?",
        answer: "What is clamp()?",
        note: "clamp(min, preferred, max). Text grows with the screen but never gets too tiny on a phone or huge on a TV. One line of CSS instead of a pile of breakpoints.",
        ask: "Why is giant text on a big monitor a problem?",
        source: "MDN Web Docs, \"clamp() CSS function\" (developer.mozilla.org)." }
    ]},
    { name: "Ctrl+Z", clues: [
      { value: 100, clue: "In a famous 1980s study, some of the smartest computer scientists were filmed trying and failing to make double-sided copies on this machine, which was made by their own company.",
        answer: "What is a Xerox copier?",
        note: "Lucy Suchman filmed Xerox researchers trying to make double-sided copies on their own company's copier, and they kept failing. If the people who build the machines can't use them, the machine is the problem, not the people.",
        ask: "When have you blamed yourself for a confusing machine?",
        source: "Lucy Suchman, Plans and Situated Actions, Cambridge University Press, 1987." },
      { value: 200, clue: "This three-letter acronym names the point-and-click world of windows, icons and menus that replaced typing commands into a code-based command line.",
        answer: "What is a GUI (graphical user interface)?",
        note: "Before GUIs you typed commands to do anything. Xerox built windows, icons and a mouse in the 1970s, and the Mac brought it to everyone in 1984. Suddenly you didn't need to know code to use a computer.",
        ask: "What's still faster to do by typing?",
        source: "Computer History Museum, Xerox Alto (1973) and Apple Macintosh (1984) collections (computerhistory.org)." },
      { value: 300, clue: "This cognitive scientist is credited with coining the term \"user experience\" in 1993, when he took the title \"User Experience Architect\" at Apple.",
        answer: "Who is Don Norman?",
        note: "He wanted a word for the whole experience of using something, not just the screen, so he took the job title \"User Experience Architect\" at Apple. He also wrote The Design of Everyday Things. A \"Norman door\" is one that says pull when you need to push.",
        ask: "Name a Norman door you've fought with.",
        source: "Don Norman & Jakob Nielsen, \"The Definition of User Experience (UX),\" Nielsen Norman Group; Don Norman, The Design of Everyday Things, 1988." },
      { value: 400, clue: "This 1954 law says the time it takes to click a target depends on how big it is and how far away it is. It's why big buttons and screen corners are easy to hit.",
        answer: "What is Fitts's Law?",
        note: "Bigger and closer means faster to hit. Screen corners are easy because your mouse can't overshoot them. That's why the Start button lives in the corner and \"Buy now\" buttons are huge.",
        ask: "Find a button on your phone that's too small.",
        source: "Paul M. Fitts, \"The information capacity of the human motor system in controlling the amplitude of movement,\" Journal of Experimental Psychology, 1954." },
      { value: 500, clue: "Most apps still use this outdated storage device as the icon for \"Save,\" even though many users have never touched one.",
        answer: "What is a floppy disk?",
        note: "Most of you have never held one, but you know it means save. Icons outlive the stuff they're based on. The phone handset for calls and the envelope for email are the same deal.",
        ask: "What would you replace the save icon with?",
        source: "Wikipedia, \"Floppy disk\"." }
    ]},
    { name: "Sticky Notes", clues: [
      { value: 100, clue: "This design thinking stage starts by learning about the people who have the problem.",
        answer: "What is empathize?",
        note: "Step one of design thinking. Before you build anything, go talk to and watch the people who actually have the problem. The paper we read says user research is still the foundation of good design.",
        ask: "How would you empathize with students before redesigning the school website?",
        source: "Stanford d.school, \"An Introduction to Design Thinking: Process Guide\"; " + READING + "." },
      { value: 200, clue: "This stage uses feedback from users to revise a model of the solution, often repeating earlier design thinking stages.",
        answer: "What is test?",
        note: "Put the prototype in front of real people and watch. It almost always sends you back a step or two, and that's normal. Better to find out now than after launch.",
        ask: "Why is it better to fail in testing?",
        source: "Stanford d.school, \"An Introduction to Design Thinking: Process Guide\"." },
      { value: 300, clue: "This company helped popularize design thinking in businesses around the world.",
        answer: "What is IDEO?",
        note: "A design firm that brought design thinking to big companies, schools and governments. They designed Apple's first mouse, and on TV in 1999 they redesigned a shopping cart in five days.",
        ask: "What would you redesign in five days?",
        source: "ABC News Nightline, \"The Deep Dive,\" 1999; ideo.com." },
      { value: 400, clue: "This author of \"The Sciences of the Artificial\" is often considered an early founder of design thinking.",
        answer: "Who is Herbert A. Simon?",
        note: "In 1969 he wrote that design is about changing existing situations into preferred ones. That covers a lot more than making things look nice: a bus schedule counts, and so does an app.",
        ask: "What's one situation at school you'd change?",
        source: "Herbert A. Simon, The Sciences of the Artificial, MIT Press, 1969." },
      { value: 500, clue: "In this design thinking stage, teams build quick, cheap, rough versions of an idea so they can learn from them.",
        answer: "What is prototype?",
        note: "Build a cheap, rough version so you can learn from it. Paper sketches count. If you're scared to throw it away, you spent too long on it. AI tools like Uizard can now turn a sketch into screens fast.",
        ask: "What's the fastest way you could prototype an app idea?",
        source: "Stanford d.school, \"An Introduction to Design Thinking: Process Guide\"; " + READING + "." }
    ]},
    { name: "Prompt me", clues: [
      { value: 100, clue: "This AI feature helps designers generate ideas, images or text during the design process.",
        answer: "What is generative AI (Gen AI)?",
        note: "AI that makes new stuff from a prompt: text, images, code, layouts. Designers use it to brainstorm and to skip boring tasks like resizing. The paper names tools like Uizard, Galileo AI and UX Pilot. You still have to check what it makes.",
        ask: "What should you always double-check in AI-made work?",
        source: READING + "." },
      { value: 200, clue: "This popular AI term describes building through prompts rather than traditional programming.",
        answer: "What is vibe coding?",
        note: "Andrej Karpathy named it in 2025. You describe the app you want, the AI writes the code, and you keep tweaking until it works. Great for quick prototypes. Someone still needs to make sure it's correct and safe.",
        ask: "If anyone can build an app, what makes a designer stand out?",
        source: "Andrej Karpathy, post on X, February 2, 2025." },
      { value: 300, clue: "This platform lets designers and developers find, share and use tools and resources made by others, and hosts millions of open source projects.",
        answer: "What is GitHub?",
        note: "Where people store code, track changes and share projects. Designers grab icon sets, UI kits and plugins there, like the free Lucide icons. The paper also tells students to get involved in online design communities.",
        ask: "Why would a company give away its design tools?",
        source: "github.com/about; " + READING + "." },
      { value: 400, clue: "This type of AI uses past behavior and data to anticipate a user's next move.",
        answer: "What is predictive AI?",
        note: "It looks at what you've done before to guess what you'll do next. Your phone suggesting the app you always open at 8am, or autocomplete finishing your sentence. It should be easy to ignore when it guesses wrong.",
        ask: "When has a prediction helped you, and when was it annoying?",
        source: READING + "." },
      { value: 500, clue: "This term describes AI-generated users used to test ideas or simulate research.",
        answer: "What are synthetic users?",
        note: "AI personas you can \"interview\" about a design. They're fast and cheap for early ideas. But they only know what's in their training data, bias included, so they can't replace talking to real people.",
        ask: "What could a real user tell you that a fake one couldn't?",
        source: "Nielsen Norman Group, \"Synthetic Users: If, When, and How to Use AI-Generated Research,\" 2024; " + READING + "." }
    ]},
    { name: "Feelin' Haptic", clues: [
      { value: 100, clue: "This kind of feedback communicates with users through touch, like your phone vibrating when a message arrives.",
        answer: "What is haptic feedback?",
        note: "Feedback you feel. The little tap when you flip a switch on an iPhone, or your watch buzzing to tell you to turn left. You know it worked without looking.",
        ask: "Which phone buzz do you recognize without looking?",
        source: "Apple Human Interface Guidelines, \"Playing haptics\"." },
      { value: 200, clue: "Starting in 2026, Euro NCAP car safety ratings reward cars that bring back these for basics like hazard lights and wipers, instead of burying them in touchscreens.",
        answer: "What are physical buttons (physical controls)?",
        note: "Touchscreens make drivers look away from the road to find the wipers. A knob you can find by feel is safer. Euro NCAP's 2026 ratings reward cars that bring basic buttons back. Newer isn't always better.",
        ask: "Where else would a real button beat a touchscreen?",
        source: "Euro NCAP 2026 rating protocols (announced 2024), euroncap.com." },
      { value: 300, clue: "This design term, made famous by Don Norman, describes how an object's shape suggests how to use it, like a handle that invites you to pull.",
        answer: "What is an affordance?",
        note: "What an object lets you do, and how its shape hints at it. A handle says pull, a flat plate says push. On screens, a button that looks raised says tap me. Don Norman made the term famous.",
        ask: "Find something in this room whose shape tells you how to use it.",
        source: "Don Norman, The Design of Everyday Things, 1988." },

        ask: "How could detailed vibration help someone who can't see the screen?",

        ask: "Which computer in your life do you forget is a computer?",
